<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>阶段5-⑪ 波动方程水场 + 程序化地表 测试（简化）</title>
  <style>
    body { margin: 0; background: #123; color: #cfe; font-family: monospace; }
    #pond { display: block; opacity: 0.25; }
    #report {
      position: fixed; top: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.88); padding: 12px; font-size: 13px;
      white-space: pre-wrap; max-height: 100vh; overflow: auto; z-index: 9;
    }
  </style>
</head>
<body>
  <canvas id="pond"></canvas>
  <div id="report">运行中…</div>
  <script type="module" src="./src/main.js"></script>
  <script type="module">
    import { CONFIG } from './src/config.js';
    import { WaterWaveField } from './src/waterwave.js';

    setTimeout(() => {
      const log = [];
      let pass = 0, fail = 0;
      const ok = (c, m) => { c ? pass++ : fail++; log.push((c ? '✅ ' : '❌ ') + m); };

      try {
        const app = window.pondApp;
        const W = app.world;
        const wave = W.wave;
        const midX = W.w / 2, midY = (W.bankLineAt(midX) + W.marshLineAt(midX)) / 2;
        // 阶段门控：?stage=N 只跑到第 N 段（二分定位卡死用）
        const stage = parseInt(new URLSearchParams(location.search).get('stage') ?? '99', 10);
        const gate = (n) => { if (stage < n) throw { __gate: true, n }; };

        // ── 1. 波场引擎 ─────────────────────────────────
        ok(wave instanceof WaterWaveField, 'world.wave 为波动方程场');

        // 扰动产生能量
        wave.calm();
        wave.disturb(midX, midY, 1.5, 3);
        const e0 = wave.energy();
        ok(e0 > 0, `扰动产生波能（E=${e0.toFixed(1)}）`);

        // 两列波叠加产生干涉（能量 ≠ 简单翻倍，但一定大于单波）
        wave.calm();
        wave.disturb(midX - 40, midY, 1, 3);
        wave.disturb(midX + 40, midY, 1, 3);
        const e2 = wave.energy();
        ok(e2 > e0 * 0.4, `双源干涉叠加（E=${e2.toFixed(1)} > 单波 ${e0.toFixed(1)}×0.4）`);

        // 能量随时间衰减（真实水面会平息）
        let eBefore = wave.energy();
        for (let i = 0; i < 240; i++) wave.update(1 / 60, { ambient: false });
        const eAfter = wave.energy();
        ok(eAfter < eBefore * 0.35, `波动自然衰减（${eBefore.toFixed(1)} → ${eAfter.toFixed(1)}）`);
        gate(2);

        // 梯度采样返回数值
        const s = wave.sample(midX, midY);
        ok(Number.isFinite(s.h) && Number.isFinite(s.gx) && Number.isFinite(s.gy),
          `梯度采样有效（h=${s.h.toFixed(3)}, gx=${s.gx.toFixed(3)}）`);

        // ── 2. 拖拽尾迹（线段补插值）────────────────────
        wave.calm();
        // 模拟光标快速划过：3 步、每步 60px —— 期待 disturbLine 补出连续尾迹
        for (let i = 0; i < 6; i++) {
          W.addWake(midX - 120 + i * 40, midY, midX - 80 + i * 40, midY + 6, 700);
        }
        const eWake = wave.energy();
        ok(eWake > 1, `鼠标尾迹写入波场（E=${eWake.toFixed(1)}）`);

        // 真实 mousemove 事件链路（main.js _cursorWake → world.addWake）
        wave.calm();
        const baseE = wave.energy();
        for (let i = 0; i <= 30; i++) {
          window.dispatchEvent(new MouseEvent('mousemove', {
            clientX: midX - 150 + i * 10, clientY: midY + Math.sin(i * 0.5) * 12,
          }));
        }
        const eMove = wave.energy();
        ok(eMove > baseE * 2 && eMove > 0.5, `mousemove 事件产生尾迹（E=${eMove.toFixed(2)}）`);
        gate(3);

        // ── 3. 程序化地表纹理 ───────────────────────────
        W._ensureTextures();
        ok(!!W.tex && !!W.tex.mud && !!W.tex.sand && !!W.tex.silt && !!W.tex.wetmud,
          '泥/沙/淤积/湿泥 四张程序纹理已生成');
        ok(W.tex.sand.width === 256 && W.tex.sand.height === 256, '纹理尺寸 256×256');
        gate(4);

        // ── 4. 渲染无异常（含波场折射 + 纹理叠加）────────
        let threw = false;
        try { W.draw(app.ctx, 45.6); } catch (e) { threw = true; log.push('渲染异常: ' + e.message); }
        ok(!threw, '完整渲染（水体+波场+泥沙纹理）无异常');

        // ── 汇总 ────────────────────────────────────────
        log.unshift(`━━ 结果：${pass} 通过 / ${fail} 失败 ━━`);
        document.getElementById('report').textContent = log.join('\n');
        window.__TEST__ = { pass, fail, log };

        // 每隔 2.5s 自动划一次鼠标（让截图能捕到可见尾迹）
        // ?auto=0 时禁用（headless dump-dom 需要页面空闲才能正常退出）
        if (!new URLSearchParams(location.search).has('auto')) {
          setInterval(() => {
            const y0 = W.bankLineAt(W.w / 2) + 80;
            for (let i = 0; i <= 40; i++) {
              setTimeout(() => {
                window.dispatchEvent(new MouseEvent('mousemove', {
                  clientX: W.w * 0.15 + (W.w * 0.7) * (i / 40),
                  clientY: y0 + Math.sin(i * 0.4) * 30,
                }));
              }, i * 16);
            }
          }, 2500);
        }
      } catch (e) {
        if (e && e.__gate) {
          log.unshift(`━━ 阶段门控：停在 gate(${e.n}) —— 结果：${pass} 通过 / ${fail} 失败 ━━`);
          document.getElementById('report').textContent = log.join('\n');
          window.__TEST__ = { pass, fail, log, gated: e.n };
        } else {
          document.getElementById('report').textContent = '测试崩溃: ' + (e.message ?? e) + '\n' + (e.stack ?? '');
          window.__TEST__ = { pass, fail: fail + 1, log: [String(e.message ?? e)] };
        }
      }
    }, 800);
  </script>
</body>
</html>
