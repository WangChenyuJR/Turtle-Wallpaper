<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>阶段6-① 存档系统 测试</title>
  <style>
    body { margin: 0; background: #123; color: #cfe; font-family: monospace; }
    #pond { display: block; opacity: 0.15; }
    #report {
      position: fixed; top: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.9); padding: 12px; font-size: 13px;
      white-space: pre-wrap; max-height: 100vh; overflow: auto;
    }
  </style>
</head>
<body>
  <canvas id="pond"></canvas>
  <div id="report">运行中…</div>

  <!-- 第一遍：清空旧档，建立"参考世界"并存档 -->
  <script type="module" src="./src/main.js"></script>
  <script type="module">
    import { SAVE_KEY, SCHEMA } from './src/save.js';
    import { CONFIG } from './src/config.js';

    const log = [];
    let pass = 0, fail = 0;
    const ok = (c, m) => { c ? pass++ : fail++; log.push((c ? '✅ ' : '❌ ') + m); };
    const finish = () => {
      log.push('');
      log.push(`—— 结果：${pass} 通过 / ${fail} 失败 ——`);
      document.getElementById('report').textContent = log.join('\n');
      window.__TEST_DONE__ = true;
      window.__TEST_RESULT__ = { pass, fail };
    };

    /** 稳定浮点比较 */
    const near = (a, b, eps = 0.05) => Math.abs(a - b) < eps;

    setTimeout(() => {
      try {
        const app = window.pondApp;

        // ══ 阶段 A：从干净状态开始，构造一个有"个性"的世界 ══
        localStorage.removeItem(SAVE_KEY);
        localStorage.removeItem('turtle-pond-state.bak');
        localStorage.removeItem('turtle-pond-state.trash');
        app.newGame(false);            // 标记 pendingReset，先别写盘
        app.save._pendingReset = false; // 手工解除，本轮要测试正常写盘

        // 跑几秒让世界动起来
        for (let i = 0; i < 100; i++) app._update(0.05, 1 + i * 0.05);

        // 造个体差异：指定一条鱼、一只龟，标记可识别的状态
        app.addFish(1, 'koi');
        app.addTurtle('redear');
        const myFish = app.fishes[app.fishes.length - 1];
        const myTurtle = app.turtles[app.turtles.length - 1];
        myFish.age = 123.5; myFish.hunger = 0.777; myFish.x = 321; myFish.y = 222;
        myFish.generation = 4; myFish.birth = 10; myFish.eaten = 9; myFish.offspring = 2;
        myFish.maxAge = 9000;
        myTurtle.age = 456.25; myTurtle.hunger = 0.333; myTurtle.x = 654; myTurtle.y = 111;
        myTurtle.state = 'bask'; myTurtle.stateTime = 7.5; myTurtle.generation = 2;
        myTurtle.birth = 20; myTurtle.eaten = 3; myTurtle.offspring = 1;
        myTurtle.shellColor = '#123456';
        myTurtle.maxAge = 20000;

        // 给它俩一个稳定 uid（模拟用户点开面板改过名）
        app.panel._ensureUid(myFish);  app.panel._ensureUid(myTurtle);
        const fishUid = myFish._uid, turtleUid = myTurtle._uid;
        app.panel._names[fishUid] = '存档测试鱼';
        app.panel._names[turtleUid] = '存档测试龟';
        app.panel._saveNames();

        // 龟蛋：孵化进度只走一半 → 读档后应保留
        const egg = app.eggs[0] ?? null;
        let eggRef = null;
        if (app.eggs.length === 0) {
          app._turtleLayEggs(myTurtle);
        }
        eggRef = app.eggs[0];
        eggRef.incubation = 40; eggRef.age = 50; eggRef.x = 500; eggRef.y = 60;

        // 昼夜 / 天气 / 总时长
        app.daynight.time = 1234.5;
        app.daynight.speed = 25;
        app.weather.state = 'rain';
        app.weather.timer = 77.5;
        app.time = 5000;
        // 投喂 → 留下未吃完的饲料
        app.food.feed(app.world.w * 0.5, app.world.bankLineAt(app.world.w * 0.5) + 30, 5);

        const snapA = app.save.snapshot();
        ok(snapA.v === SCHEMA, `存档版本号 = ${SCHEMA}`);
        ok(snapA.fishes.length === app.fishes.length, `快照含全部鱼（${snapA.fishes.length}）`);
        ok(snapA.turtles.length === app.turtles.length, `快照含全部龟（${snapA.turtles.length}）`);
        ok(snapA.plants.length === app.plants.plants.length, `快照含全部植物（${snapA.plants.length}）`);
        ok(snapA.snails.length > 0 && snapA.shrimps.length > 0, `快照含螺虾（${snapA.snails.length}/${snapA.shrimps.length}）`);
        ok(snapA.eggs.length > 0, '快照含龟蛋');

        // 个体字段完整性
        const fSnap = snapA.fishes.find((f) => f.uid === fishUid);
        ok(!!fSnap, '快照里能找到指定鱼（uid 对齐）');
        ok(near(fSnap.age, 123.5) && near(fSnap.hunger, 0.777) && near(fSnap.x, 321)
           && fSnap.gen === 4 && fSnap.eaten === 9,
          '鱼的年龄/饥饿/坐标/世代/吃食数已写入');
        const tSnap = snapA.turtles.find((t) => t.uid === turtleUid);
        ok(!!tSnap && tSnap.state === 'bask' && near(tSnap.stateTime, 7.5)
           && tSnap.shellColor === '#123456',
          '龟的状态机/壳色已写入');

        // ══ 阶段 B：写盘 ══
        app.save.touch();
        const wrote = app.save.save('manual');
        ok(wrote, 'save() 写盘成功');
        const raw = localStorage.getItem(SAVE_KEY);
        ok(!!raw, 'localStorage 里存在存档');
        ok(raw.length > 1000, `存档体积合理（${raw.length} 字节 ≈ ${(raw.length / 1024).toFixed(1)} KB）`);

        const info = app.saveInfo();
        ok(info.hasSave === true, 'saveInfo() 报告有存档');
        ok(info.current.fish === app.fishes.length, `概要鱼数正确（${info.current.fish}）`);

        // ══ 阶段 C：模拟"关掉壁纸再打开" ══
        // 做法：在一个全新容器里重建 PondApp（不刷新页面，便于断言）
        const P = app.constructor;
        const canvas2 = document.createElement('canvas');
        canvas2.id = 'pond2';
        // 复用同一个 canvas：直接再 new 一次 PondApp 会重新绑定事件，但测试里可接受
        const app2 = new P(undefined, { resume: true });

        ok(app2.resumed === true, '第二个实例成功读档（resumed = true）');
        ok(app2.fishes.length === app.fishes.length, `读档后鱼数一致（${app2.fishes.length}）`);
        ok(app2.turtles.length === app.turtles.length, `读档后龟数一致（${app2.turtles.length}）`);

        const f2 = app2.fishes.find((f) => f._uid === fishUid);
        ok(!!f2, '读档后能找到那只鱼（uid 保留）');
        ok(near(f2.age, 123.5, 0.01) && near(f2.hunger, 0.777, 0.01) && near(f2.x, 321, 0.01),
          `鱼的状态精确还原（age=${f2.age.toFixed(2)} hunger=${f2.hunger.toFixed(3)} x=${f2.x.toFixed(1)}）`);
        ok(f2.generation === 4 && f2.birth === 10 && f2.eaten === 9 && f2.offspring === 2,
          '鱼的世代/出生/吃食/后代统计还原');
        ok(near(f2.maxAge, 9000, 0.01), `鱼的寿命上限还原（${f2.maxAge}）`);

        const t2 = app2.turtles.find((t) => t._uid === turtleUid);
        ok(!!t2, '读档后能找到那只龟');
        ok(near(t2.age, 456.25, 0.01) && t2.state === 'bask' && near(t2.stateTime, 7.5, 0.01),
          `龟的状态机还原（state=${t2.state} stateTime=${t2.stateTime}）`);
        ok(t2.shellColor === '#123456', '龟的壳色还原');
        ok(typeof t2.onLayEggs === 'function', '读档后产蛋回调已重新挂上');

        // 龟蛋孵化进度
        const e2 = app2.eggs[0];
        ok(app2.eggs.length === app.eggs.length, `龟蛋数量一致（${app2.eggs.length}）`);
        ok(e2 && near(e2.incubation, 40, 0.01) && near(e2.age, 50, 0.01),
          `龟蛋孵化进度未重置（incubation=${e2?.incubation}）`);

        // 昼夜 / 天气 / 总时长
        ok(near(app2.daynight.time, 1234.5, 0.01), `昼夜时刻还原（${app2.daynight.time}）`);
        ok(app2.daynight.speed === 25, '时间流速还原（×25）');
        ok(app2.weather.state === 'rain', '天气状态还原（rain）');
        ok(near(app2.weather.timer, 77.5, 0.01), '天气计时还原');
        ok(near(app2.time, 5000, 0.01), `水塘总时长还原（${app2.time}s）`);

        // 植物 / 分解者 / 浮萍 / 饲料
        ok(app2.plants.plants.length === app.plants.plants.length,
          `植物逐株还原（${app2.plants.plants.length} 株，非按数量随机）`);
        const p1 = app.plants.plants[0], p2 = app2.plants.plants[0];
        ok(near(p1.x, p2.x, 0.01) && near(p1.swayPhase, p2.swayPhase, 0.01),
          '植物位置/相位一致');
        ok(app2.scavengers.snails.length === app.scavengers.snails.length
           && app2.scavengers.shrimps.length === app.scavengers.shrimps.length,
          '螺虾数量一致');
        ok(app2.scavengers.snails[0].zone === app.scavengers.snails[0].zone,
          '螺蛳分区还原');
        ok(near(app2.scavengers.snails[0].shellHue, app.scavengers.snails[0].shellHue, 0.01),
          '螺蛳壳色还原');
        ok(app2.duckweed.items.length === app.duckweed.items.length, '浮萍数量一致');
        ok(app2.food.items.length === app.food.items.length,
          `未吃完的饲料还原（${app2.food.items.length} 颗）`);

        // 命名对齐
        ok(app2.panel._names[fishUid] === '存档测试鱼',
          '名字与个体对齐（重启不再错位）');
        ok(app2.panel._seq >= Math.max(fishUid, turtleUid),
          `新实例 uid 计数器已避开存档占用的 uid（seq=${app2.panel._seq}）`);

        // ══ 阶段 D：清档 / 恢复 / 导出导入 ══
        const trashOk = app2.newGame(false);
        ok(trashOk.recoverable, '清档后旧档进了"可恢复"位');
        ok(!localStorage.getItem(SAVE_KEY), '清档后主存档位已空');
        ok(app2.save.hasTrash(), 'trash 位存在');
        // 读档应失败 → 回退到新建
        ok(app2.save.read() === null, '清档后 read() 返回 null（不会读到旧档）');

        // 撤销清档
        const undoOk = app2.undoReset();
        ok(undoOk.ok, 'undoReset() 恢复成功');
        const back = app2.save.read();
        ok(!!back && back.fishes.length === app.fishes.length, '恢复后的档内容完整');

        // 导出（只验证生成 JSON 文本，不真的下载）
        const jsonText = JSON.stringify(app2.save.snapshot(), null, 2);
        ok(jsonText.startsWith('{') && jsonText.includes('"fishes"'), '导出 JSON 结构正确');
        const parsed = JSON.parse(jsonText);
        ok(parsed.fishes.length === app.fishes.length, '导出的 JSON 可被解析且内容完整');

        // 导入（把导出的 JSON 写回去）
        localStorage.removeItem(SAVE_KEY);
        const imp = app2.importSave(jsonText);
        ok(imp.ok, `importSave() 成功（${JSON.stringify(imp.summary).slice(0, 60)}…）`);
        ok(!!localStorage.getItem(SAVE_KEY), '导入后存档位已写入');

        // 版本不符的档要被拒绝
        const badVer = JSON.stringify({ v: 999, fishes: [] });
        const impBad = app2.importSave(badVer);
        ok(!impBad.ok, '版本不符的档被拒绝导入');
        const impGarbage = app2.importSave('这不是 json');
        ok(!impGarbage.ok, '非法内容被拒绝导入');

        // 品种被删除时不应崩
        const weird = JSON.parse(jsonText);
        weird.fishes.push({ sp: '不存在的鱼', x: 1, y: 1 });
        weird.turtles.push({ sp: '不存在的龟', x: 1, y: 1 });
        const impWeird = app2.importSave(JSON.stringify(weird));
        ok(impWeird.ok, '未知品种写入不报错');
        const app3 = new P(undefined, { resume: true });
        ok(app3.fishes.every((f) => f.species && f.species.id),
          '读档时跳过未知品种（不产生坏个体）');

        // ══ 阶段 E：稳定性 —— 读档后长跑 ══
        let crashed = false;
        try { for (let i = 0; i < 400; i++) app3._update(0.05, 5000 + i * 0.05); }
        catch (e) { crashed = true; log.push('  ' + e.message); }
        ok(!crashed && app3.fishes.every((f) => isFinite(f.x) && isFinite(f.y)),
          '读档后长跑 20s 无异常、坐标有效');

        // ══ 阶段 F：快捷键 ══
        const press = (key, opts = {}) => {
          window.dispatchEvent(new KeyboardEvent('keydown', {
            key, bubbles: true, cancelable: true, ...opts,
          }));
        };

        // S = 立即存档
        localStorage.removeItem(SAVE_KEY);
        app3.save._pendingReset = false;
        press('s');
        ok(!!localStorage.getItem(SAVE_KEY), '按 S 触发立即存档（localStorage 已写入）');
        ok(app3._toastText.includes('已存档'), `S 键提示正确（"${app3._toastText}"）`);
        ok(app3._toastTimer > 0, '提示条计时器已启动');

        // Shift+S = 导出（无头环境下 a.click() 不报错即可）
        let exportErr = null, downloadName = null;
        const origClick = HTMLAnchorElement.prototype.click;
        HTMLAnchorElement.prototype.click = function () { downloadName = this.download; };
        try { press('s', { shiftKey: true }); } catch (e) { exportErr = e.message; }
        finally { HTMLAnchorElement.prototype.click = origClick; }
        ok(!exportErr, 'Shift+S 导出未抛异常');
        ok(!!downloadName && downloadName.endsWith('.json'),
          `Shift+S 生成 JSON 下载（${downloadName}）`);
        ok(app3._toastText.includes('已导出'), `Shift+S 提示正确（"${app3._toastText}"）`);

        // 输入框内打字不能触发快捷键（否则改名打不出 s/t/w）
        const fakeInput = document.createElement('input');
        document.body.appendChild(fakeInput);
        const beforeTurtles = app3.turtles.length;
        const evt = new KeyboardEvent('keydown', { key: 't', bubbles: true, cancelable: true });
        fakeInput.dispatchEvent(evt);
        ok(app3.turtles.length === beforeTurtles,
          '在输入框内按 T 不会添加乌龟（不抢按键）');
        fakeInput.remove();

        // 其它既有快捷键未被破坏
        const beforeFish = app3.fishes.length;
        press('1');
        ok(app3.fishes.length === beforeFish + 1, '数字键 1 仍能按品种加鱼（无回归）');
        app3.removeFish(1);

        const beforeT2 = app3.turtles.length;
        press('t');
        ok(app3.turtles.length === beforeT2 + 1, 'T 键仍能加龟（无回归）');
        app3.removeTurtle(1);

        const pausedBefore = app3.paused;
        press(' ');
        ok(app3.paused !== pausedBefore, '空格仍能暂停/继续（无回归）');
        app3.paused = false;

        // ══ 阶段 G：提示条渲染不崩 ══
        app3._toast('测试提示条');
        let renderErr = null;
        try { app3._render(1); for (let i = 0; i < 30; i++) app3._loop(performance.now() + i * 16); }
        catch (e) { renderErr = e.message; }
        ok(!renderErr, '提示条渲染无异常');

        // 收尾：清理测试产生的存档，避免影响正常使用
        localStorage.removeItem(SAVE_KEY);
        localStorage.removeItem('turtle-pond-state.bak');
        localStorage.removeItem('turtle-pond-state.trash');
        log.push('');
        log.push('（测试结束，已清理 localStorage 中的测试存档）');

        finish();
      } catch (err) {
        log.push('❌ 异常: ' + err.message);
        log.push(err.stack ?? '');
        finish();
      }
    }, 600);
  </script>
</body>
</html>
