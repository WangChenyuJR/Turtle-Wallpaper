<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>黄喉拟水龟 · 矢量风格测试</title>
<style>
  body { margin: 0; padding: 18px; background: #f5f1e6; color: #3a3428;
         font-family: "Microsoft YaHei", sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { font-size: 13px; color: #7a7260; margin-bottom: 16px; }
  .row { display: flex; align-items: center; gap: 18px; background: #fffdf6;
         border: 1px solid #e2d9c2; border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .row .num { width: 34px; height: 34px; border-radius: 50%; background: #7a6a3a; color: #fff;
              display: flex; align-items: center; justify-content: center; font-size: 17px; flex: none; }
  .big  canvas { width: 240px; height: 240px; display: block; }
  .anim canvas { width: 230px; height: 140px; display: block; border-radius: 8px; }
  .desc { flex: 1; font-size: 13px; line-height: 1.65; }
  .desc h3 { margin: 0 0 6px; font-size: 15px; }
  .desc p { margin: 0; color: #5c5544; }
  .foot { font-size: 12px; color: #8a8270; margin-top: 10px; line-height: 1.7; }
  .gal-title { font-size: 15px; margin: 0 0 8px; }
  #gallery { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 22px; }
  .gcell { background: #fffdf6; border: 1px solid #e2d9c2; border-radius: 10px; padding: 8px 8px 6px; }
  .gcell canvas { width: 100%; height: auto; display: block; border-radius: 6px; }
  .gcell .gname { font-size: 13px; margin-top: 6px; text-align: center; }
  .gcell .gtag { font-size: 11px; color: #8a8270; text-align: center; }
</style>
</head>
<body>
<h1>黄喉拟水龟 · 矢量绘制风格测试（俯视 / 侧视）</h1>
<div class="sub">目标：介于现有简洁线段（0）与水彩立绘之间的中间档。顶部画廊 = H 侧视风格 × 13 品种，下方每行 = 静态大图 + 游动动画。</div>
<h2 class="gal-title">H 风格 · 13 品种侧视一览（壳形 / 纹样 / 头颈标志随品种变化）</h2>
<div id="gallery"></div>
<div id="rows"></div>
<div class="foot">
  注：动画以四肢划水相位驱动，无头环境亦可见摆动姿态。选定编号后正式接入 turtle.js 时，
  壳/头等静态部件将按品种离屏缓存（每品种仅渲染一次），四肢与尾每帧动态绘制，预计整体帧成本与现状相当。
</div>

<script>
'use strict';
// ── 黄喉拟水龟色板（与 species.js 一致）─────────────────
const YT = {
  shell: '#7a6a3a',   // 背甲橄榄棕
  band:  '#a89254',   // 缘盾黄褐环带
  scute: '#85754a',   // 椎盾微亮
  limb:  '#5f5230',   // 四肢灰褐
  head:  '#8a8040',   // 头
  yellow:'#e8d24e',   // 头侧淡黄纵纹
  yellow2:'#f2e27a',  // 黄纹内芯
  line:  '#3a3122',   // 描边深褐
  ridge: '#5d5030',   // 脊棱暗线
  ridgeHi:'#a08e58',  // 脊棱受光
};
const INK = { // D 墨线淡彩：整体降饱和
  shell: '#7d7154', band: '#a99b6e', scute: '#6f6448', limb: '#5e5544',
  head:  '#7f7858', yellow: '#d9c980', yellow2: '#e6d998',
  line:  '#2c281e', ridge: '#4a4335', ridgeHi: '#d8cfae',
};

// 固定种子伪随机（保证每帧绘制结果一致，不闪烁）
function sRand(seed) {
  return () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
}

// ── 通用部件 ──────────────────────────────────────────────
function drawLegs(ctx, s, ph, C, o) {
  const swing = Math.sin(ph) * (o.paddle ? 0.5 : 0.22);
  const pos = [[s*0.32,-s*0.42],[s*0.32,s*0.42],[-s*0.3,-s*0.42],[-s*0.3,s*0.42]];
  pos.forEach(([lx,ly], i) => {
    const sw = i % 2 === 0 ? swing : -swing;
    ctx.save();
    ctx.translate(lx + sw*s*0.28, ly);
    ctx.rotate(sw*0.4);
    ctx.beginPath();
    ctx.ellipse(0, 0, s*0.16, s*0.11, 0, 0, Math.PI*2);
    ctx.fillStyle = C.limb; ctx.fill();
    if (o.outline) { ctx.strokeStyle = C.line; ctx.lineWidth = Math.max(1, s*0.018); ctx.stroke(); }
    if (o.joint) { // 关节褶线
      ctx.beginPath(); ctx.moveTo(-s*0.05, -s*0.09); ctx.quadraticCurveTo(-s*0.10, 0, -s*0.05, s*0.09);
      ctx.strokeStyle = 'rgba(0,0,0,0.30)'; ctx.lineWidth = Math.max(0.8, s*0.012); ctx.stroke();
    }
    if (o.toes) { // 趾蹼分开：3 条短线
      ctx.strokeStyle = o.inkToes ? C.line : 'rgba(0,0,0,0.42)';
      ctx.lineWidth = Math.max(0.9, s*0.014); ctx.lineCap = 'round';
      [-0.5, 0, 0.5].forEach((a) => {
        ctx.beginPath(); ctx.moveTo(s*0.10, a*s*0.045);
        ctx.lineTo(s*0.165, a*s*0.085); ctx.stroke();
      });
    }
    ctx.restore();
  });
}

function drawHead(ctx, s, ph, C, o) {
  const ext = 0.42;
  const bob = Math.sin(ph*0.66) * s * 0.03;
  const hx = s*(0.45+ext), hy = bob;
  ctx.save();
  // 头本体
  ctx.beginPath(); ctx.ellipse(hx, hy, s*0.20, s*0.16, 0, 0, Math.PI*2);
  ctx.fillStyle = C.head; ctx.fill();
  if (o.outline) { ctx.strokeStyle = C.line; ctx.lineWidth = Math.max(1, s*0.02); ctx.stroke(); }
  // 头侧黄色纵纹（眼后 → 颈，黄喉标志）
  if (o.mark) { // 现状基线的简单黄斑
    ctx.fillStyle = C.yellow;
    ctx.beginPath(); ctx.ellipse(hx - s*0.02, hy - s*0.09, s*0.07, s*0.035, -0.3, 0, Math.PI*2); ctx.fill();
  }
  if (o.stripes) {
    [-1, 1].forEach((sd) => {
      ctx.beginPath();
      ctx.moveTo(hx - s*0.06, hy + sd*s*0.075);
      ctx.quadraticCurveTo(hx + s*0.05, hy + sd*s*0.105, hx + s*0.17, hy + sd*s*0.065);
      ctx.strokeStyle = C.yellow; ctx.lineWidth = s*0.05; ctx.lineCap = 'round'; ctx.stroke();
      if (o.stripeCore) { // 内芯更亮（水彩叠色感）
        ctx.beginPath();
        ctx.moveTo(hx - s*0.02, hy + sd*s*0.078);
        ctx.quadraticCurveTo(hx + s*0.06, hy + sd*s*0.098, hx + s*0.15, hy + sd*s*0.066);
        ctx.strokeStyle = C.yellow2; ctx.lineWidth = s*0.02; ctx.stroke();
      }
      if (o.inkMark) { // 墨线勾边
        ctx.beginPath();
        ctx.moveTo(hx - s*0.06, hy + sd*s*0.075);
        ctx.quadraticCurveTo(hx + s*0.05, hy + sd*s*0.105, hx + s*0.17, hy + sd*s*0.065);
        ctx.strokeStyle = 'rgba(44,40,30,0.55)'; ctx.lineWidth = Math.max(0.7, s*0.008); ctx.stroke();
      }
    });
  }
  // 颈褶
  if (o.neck) {
    ctx.strokeStyle = 'rgba(0,0,0,0.28)'; ctx.lineWidth = Math.max(0.8, s*0.011);
    [-1, 1].forEach((sd) => {
      ctx.beginPath();
      ctx.moveTo(hx - s*0.10, hy + sd*s*0.05);
      ctx.quadraticCurveTo(hx - s*0.14, hy + sd*s*0.09, hx - s*0.09, hy + sd*s*0.13);
      ctx.stroke();
    });
  }
  // 头顶碎斑
  if (o.spots) {
    const r = sRand(23);
    ctx.fillStyle = 'rgba(0,0,0,0.20)';
    for (let i = 0; i < 5; i++) {
      ctx.beginPath();
      ctx.ellipse(hx - s*0.02 + r()*s*0.14, hy - s*0.06 + r()*s*0.12,
                  s*0.014 + r()*s*0.012, s*0.010 + r()*s*0.008, r()*3, 0, Math.PI*2);
      ctx.fill();
    }
  }
  // 双眼（俯视对称）+ 留白高光
  if (o.eyes) {
    [-1, 1].forEach((sd) => {
      ctx.beginPath(); ctx.arc(hx + s*0.095, hy + sd*s*0.088, Math.max(1.4, s*0.036), 0, Math.PI*2);
      ctx.fillStyle = '#141210'; ctx.fill();
      ctx.beginPath(); ctx.arc(hx + s*0.105, hy + sd*s*(0.088 - 0.012*sd) - s*0.012,
                               Math.max(0.5, s*0.011), 0, Math.PI*2);
      ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fill();
    });
  }
  // 嘴缝
  if (o.mouth) {
    ctx.beginPath(); ctx.moveTo(hx + s*0.185, hy);
    ctx.quadraticCurveTo(hx + s*0.14, hy + s*0.035, hx + s*0.09, hy + s*0.03);
    ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = Math.max(0.8, s*0.012);
    ctx.lineCap = 'round'; ctx.stroke();
  }
  ctx.restore();
  return { hx, hy };
}

function drawTail(ctx, s, ph, C, o) {
  const wag = Math.sin(ph*0.8) * 0.08;
  ctx.save();
  ctx.rotate(wag);
  ctx.beginPath();
  ctx.moveTo(-s*0.53, 0);
  ctx.quadraticCurveTo(-s*0.66, -s*0.10, -s*0.72, -s*0.03);
  ctx.quadraticCurveTo(-s*0.66, s*0.09, -s*0.53, s*0.06);
  ctx.closePath();
  ctx.fillStyle = C.limb; ctx.fill();
  if (o.outline) { ctx.strokeStyle = C.line; ctx.lineWidth = Math.max(1, s*0.016); ctx.stroke(); }
  ctx.restore();
}

// ── 风格 0：现状基线（渐变壳 + 简单纵纹）──────────────
function drawBase(ctx, s, ph) {
  const C = YT;
  drawLegs(ctx, s, ph, C, {});
  drawHead(ctx, s, ph, C, { mark: true, eyes: false });
  // 单眼（现状只画一只）
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(s*1.32, Math.sin(ph*0.66)*s*0.03 - s*0.06, Math.max(1.2, s*0.035), 0, Math.PI*2); ctx.fill();
  const ry = s*0.46;
  const g = ctx.createRadialGradient(-s*0.08, -s*0.08, s*0.1, 0, 0, s*0.62);
  g.addColorStop(0, '#9b8a52'); g.addColorStop(1, C.shell);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(0, 0, s*0.56, ry, 0, 0, Math.PI*2); ctx.fill();
  // lines 纹（近似现状：3 条细长椭圆）
  ctx.strokeStyle = 'rgba(0,0,0,0.28)'; ctx.lineWidth = Math.max(1, s*0.024);
  [-1, 0, 1].forEach((i) => {
    ctx.beginPath();
    ctx.ellipse(0, 0, s*0.16, ry*(0.9 - Math.abs(i)*0.18), i*0.5, 0, Math.PI*2);
    ctx.stroke();
  });
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.beginPath(); ctx.ellipse(-s*0.14, -s*0.14, s*0.18, s*0.11, -0.4, 0, Math.PI*2); ctx.fill();
  drawTail(ctx, s, ph, C, {});
}

// ── 壳：描边分层（A 的核心）───────────────────────────
function shellOutline(ctx, s, C, o) {
  const rx = s*0.56, ry = s*0.46;
  const lw = Math.max(1, s*0.02);
  // 缘盾环带
  ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI*2);
  ctx.fillStyle = C.band; ctx.fill();
  ctx.strokeStyle = C.line; ctx.lineWidth = lw; ctx.stroke();
  // 中央甲
  ctx.beginPath(); ctx.ellipse(0, 0, rx*0.80, ry*0.76, 0, 0, Math.PI*2);
  ctx.fillStyle = C.shell; ctx.fill();
  if (o.ink) { ctx.strokeStyle = 'rgba(44,40,30,0.5)'; ctx.lineWidth = lw*0.6; ctx.stroke(); }
  // 椎盾纵条
  if (!o.ink) {
    ctx.beginPath(); ctx.ellipse(0, 0, s*0.13, ry*0.62, 0, 0, Math.PI*2);
    ctx.fillStyle = C.scute; ctx.fill();
  }
  // 盾片缝：竖 2 + 横 3
  ctx.strokeStyle = o.ink ? 'rgba(44,40,30,0.38)' : 'rgba(0,0,0,0.22)';
  ctx.lineWidth = Math.max(0.8, s*0.011);
  [-1, 1].forEach((sd) => {
    ctx.beginPath(); ctx.moveTo(sd*s*0.17, -ry*0.62);
    ctx.quadraticCurveTo(sd*s*0.22, 0, sd*s*0.17, ry*0.62); ctx.stroke();
  });
  [-0.62, 0, 0.62].forEach((f) => {
    ctx.beginPath(); ctx.moveTo(-rx*0.72, ry*f*0.76);
    ctx.quadraticCurveTo(0, ry*(f*0.76 + 0.08), rx*0.72, ry*f*0.76); ctx.stroke();
  });
}

// ── 风格 A：硬朗描边（扁平图标感）────────────────────
function drawA(ctx, s, ph) {
  const C = YT, o = { outline: true, toes: true, stripes: true, eyes: true, mouth: true };
  drawLegs(ctx, s, ph, C, o);
  drawHead(ctx, s, ph, C, o);
  shellOutline(ctx, s, C, {});
  drawTail(ctx, s, ph, C, o);
}

// ── 风格 B：自然图鉴（A + 生长纹/脊棱/缘盾辐射/颈褶）──
function shellNatural(ctx, s, C, o) {
  shellOutline(ctx, s, C, o);
  const rx = s*0.56, ry = s*0.46;
  // 三条脊棱：中央暗线+受光线，两侧弱线
  ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(80,68,38,0.65)'; ctx.lineWidth = Math.max(1.2, s*0.028);
  ctx.beginPath(); ctx.moveTo(0, -ry*0.66); ctx.quadraticCurveTo(0, 0, 0, ry*0.66); ctx.stroke();
  ctx.strokeStyle = 'rgba(175,156,98,0.7)'; ctx.lineWidth = Math.max(0.9, s*0.013);
  ctx.beginPath(); ctx.moveTo(s*0.014, -ry*0.66); ctx.quadraticCurveTo(s*0.014, 0, s*0.014, ry*0.66); ctx.stroke();
  ctx.strokeStyle = 'rgba(80,68,38,0.32)';
  [-1, 1].forEach((sd) => {
    ctx.beginPath(); ctx.moveTo(sd*s*0.15, -ry*0.56);
    ctx.quadraticCurveTo(sd*s*0.17, 0, sd*s*0.15, ry*0.56); ctx.stroke();
  });
  // 生长纹 2 圈（虚线弧）
  ctx.strokeStyle = 'rgba(0,0,0,0.30)'; ctx.lineWidth = Math.max(1, s*0.013);
  ctx.setLineDash([s*0.045, s*0.04]);
  [0.55, 0.68].forEach((f) => {
    ctx.beginPath(); ctx.ellipse(0, 0, rx*0.8*f/0.8, ry*0.76*f/0.8, 0, -0.4, Math.PI+0.4); ctx.stroke();
  });
  ctx.setLineDash([]);
  // 缘盾辐射分隔线
  ctx.strokeStyle = 'rgba(0,0,0,0.26)'; ctx.lineWidth = Math.max(0.8, s*0.010);
  for (let i = 0; i < 14; i++) {
    const a = (i/14)*Math.PI*2 + 0.12;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*rx*0.80, Math.sin(a)*ry*0.76);
    ctx.lineTo(Math.cos(a)*rx*0.97, Math.sin(a)*ry*0.965);
    ctx.stroke();
  }
}

function drawB(ctx, s, ph) {
  const C = YT, o = { outline: true, toes: true, joint: true, stripes: true,
                      eyes: true, mouth: true, neck: true, spots: true };
  drawLegs(ctx, s, ph, C, o);
  drawHead(ctx, s, ph, C, o);
  shellNatural(ctx, s, C, {});
  drawTail(ctx, s, ph, C, o);
}

// ── 风格 C：轻水彩（B + 晕染斑/洇纸边/高光弧带）───────
function washPath(ctx, s, seed) { // 轮廓微扰（手绘边，首尾闭合）
  const rx = s*0.56, ry = s*0.46, r = sRand(seed);
  const j = [];
  for (let i = 0; i < 16; i++) j.push(1 + (r()-0.5)*0.035);
  ctx.beginPath();
  const N = 16;
  for (let i = 0; i <= N; i++) {
    const a = (i/N)*Math.PI*2;
    const k = i % N;
    const x = Math.cos(a)*rx*j[k], y = Math.sin(a)*ry*j[k];
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.closePath();
}

function shellWash(ctx, s) {
  const C = YT, rx = s*0.56, ry = s*0.46;
  // 洇纸外晕 2 层
  [ {w: s*0.10, a: 0.10}, {w: s*0.045, a: 0.16} ].forEach(({w, a}) => {
    washPath(ctx, s, 11);
    ctx.strokeStyle = C.band; ctx.globalAlpha = a; ctx.lineWidth = w; ctx.stroke();
    ctx.globalAlpha = 1;
  });
  // 壳体（渐变 + 扰动轮廓）
  const g = ctx.createRadialGradient(-s*0.12, -s*0.12, s*0.08, 0, 0, rx*1.05);
  g.addColorStop(0, '#94834f'); g.addColorStop(1, '#6e6038');
  washPath(ctx, s, 11); ctx.fillStyle = g; ctx.fill();
  // 环带
  washPath(ctx, s, 11); ctx.strokeStyle = 'rgba(168,146,84,0.55)';
  ctx.lineWidth = s*0.055; ctx.stroke();
  // 椎盾 + 盾缝（淡）
  ctx.beginPath(); ctx.ellipse(0, 0, s*0.13, ry*0.62, 0, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(133,117,74,0.6)'; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = Math.max(0.8, s*0.010);
  [-1, 1].forEach((sd) => {
    ctx.beginPath(); ctx.moveTo(sd*s*0.17, -ry*0.62);
    ctx.quadraticCurveTo(sd*s*0.22, 0, sd*s*0.17, ry*0.62); ctx.stroke();
  });
  [-0.62, 0, 0.62].forEach((f) => {
    ctx.beginPath(); ctx.moveTo(-rx*0.72, ry*f*0.76);
    ctx.quadraticCurveTo(0, ry*(f*0.76 + 0.08), rx*0.72, ry*f*0.76); ctx.stroke();
  });
  // 脊棱
  ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(93,80,48,0.45)'; ctx.lineWidth = Math.max(1, s*0.02);
  ctx.beginPath(); ctx.moveTo(0, -ry*0.64); ctx.quadraticCurveTo(0, 0, 0, ry*0.64); ctx.stroke();
  ctx.strokeStyle = 'rgba(200,180,120,0.5)'; ctx.lineWidth = Math.max(0.8, s*0.010);
  ctx.beginPath(); ctx.moveTo(s*0.013, -ry*0.64); ctx.quadraticCurveTo(s*0.013, 0, s*0.013, ry*0.64); ctx.stroke();
  // 生长纹
  ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.setLineDash([s*0.045, s*0.04]);
  [0.55, 0.68].forEach((f) => {
    ctx.beginPath(); ctx.ellipse(0, 0, rx*f, ry*0.95*f, 0, -0.4, Math.PI+0.4); ctx.stroke();
  });
  ctx.setLineDash([]);
  // 缘盾辐射
  ctx.strokeStyle = 'rgba(0,0,0,0.18)';
  for (let i = 0; i < 14; i++) {
    const a = (i/14)*Math.PI*2 + 0.12;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*rx*0.80, Math.sin(a)*ry*0.76);
    ctx.lineTo(Math.cos(a)*rx*0.97, Math.sin(a)*ry*0.965);
    ctx.stroke();
  }
  // 水彩晕染斑（固定 seed，3 亮 3 暗）
  const r = sRand(37);
  for (let i = 0; i < 6; i++) {
    const dark = i >= 3;
    ctx.beginPath();
    ctx.ellipse((r()-0.5)*rx*0.9, (r()-0.5)*ry*0.9,
                s*(0.07 + r()*0.09), s*(0.05 + r()*0.07), r()*Math.PI, 0, Math.PI*2);
    ctx.fillStyle = dark ? 'rgba(87,73,42,0.12)' : 'rgba(203,189,130,0.13)';
    ctx.fill();
  }
  // 高光弧带（左上）+ 下缘内阴影
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.ellipse(0, 0, rx*0.86, ry*0.84, 0, -2.6, -1.0);
  ctx.strokeStyle = 'rgba(255,255,255,0.20)'; ctx.lineWidth = s*0.05; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0, 0, rx*0.86, ry*0.84, 0, 0.6, 2.4);
  ctx.strokeStyle = 'rgba(0,0,0,0.10)'; ctx.lineWidth = s*0.055; ctx.stroke();
}

function drawC(ctx, s, ph) {
  const C = YT, o = { outline: false, toes: true, joint: true, stripes: true, stripeCore: true,
                      eyes: true, mouth: true, neck: true, spots: true };
  // 头部水彩外晕
  ctx.save();
  const bob = Math.sin(ph*0.66) * s*0.03;
  ctx.beginPath(); ctx.ellipse(s*0.87, bob, s*0.24, s*0.20, 0, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(138,128,64,0.20)'; ctx.lineWidth = s*0.05; ctx.stroke();
  ctx.restore();
  drawLegs(ctx, s, ph, C, o);
  drawHead(ctx, s, ph, C, o);
  shellWash(ctx, s);
  drawTail(ctx, s, ph, C, o);
}

// ── 风格 D：墨线淡彩（降饱和 + 墨线复笔 + 排线）───────
function drawD(ctx, s, ph) {
  const C = INK, o = { outline: true, toes: true, joint: true, stripes: true, inkMark: true,
                       eyes: true, mouth: true, neck: true, spots: true };
  drawLegs(ctx, s, ph, C, o);
  drawHead(ctx, s, ph, C, o);
  const rx = s*0.56, ry = s*0.46;
  // 壳平涂
  ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI*2);
  ctx.fillStyle = C.shell; ctx.fill();
  // 排线阴影（clip 后 45° 平行线）
  ctx.save();
  ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI*2); ctx.clip();
  ctx.strokeStyle = 'rgba(0,0,0,0.10)'; ctx.lineWidth = Math.max(0.8, s*0.012);
  for (let d = -s; d < s; d += s*0.065) {
    ctx.beginPath(); ctx.moveTo(d, -s); ctx.lineTo(d - s*1.4, s); ctx.stroke();
  }
  ctx.restore();
  // 环带（半透明叠加）
  ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI*2);
  ctx.strokeStyle = C.band; ctx.lineWidth = s*0.075; ctx.globalAlpha = 0.75; ctx.stroke();
  ctx.globalAlpha = 1;
  // 盾缝墨线
  ctx.strokeStyle = 'rgba(44,40,30,0.38)'; ctx.lineWidth = Math.max(0.8, s*0.011);
  [-1, 1].forEach((sd) => {
    ctx.beginPath(); ctx.moveTo(sd*s*0.17, -ry*0.62);
    ctx.quadraticCurveTo(sd*s*0.22, 0, sd*s*0.17, ry*0.62); ctx.stroke();
  });
  // 脊棱：墨线 + 留白受光
  ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(74,67,53,0.7)'; ctx.lineWidth = Math.max(1, s*0.02);
  ctx.beginPath(); ctx.moveTo(0, -ry*0.66); ctx.quadraticCurveTo(0, 0, 0, ry*0.66); ctx.stroke();
  ctx.strokeStyle = 'rgba(216,207,174,0.55)'; ctx.lineWidth = Math.max(0.8, s*0.010);
  ctx.beginPath(); ctx.moveTo(s*0.012, -ry*0.66); ctx.quadraticCurveTo(s*0.012, 0, s*0.012, ry*0.66); ctx.stroke();
  // 生长纹
  ctx.strokeStyle = 'rgba(44,40,30,0.22)'; ctx.setLineDash([s*0.045, s*0.04]);
  [0.55, 0.68].forEach((f) => {
    ctx.beginPath(); ctx.ellipse(0, 0, rx*f, ry*0.95*f, 0, -0.4, Math.PI+0.4); ctx.stroke();
  });
  ctx.setLineDash([]);
  // 墨线复笔描边
  ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI*2);
  ctx.strokeStyle = C.line; ctx.lineWidth = Math.max(1.4, s*0.026); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0, 0, rx + s*0.008, ry + s*0.008, 0, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(44,40,30,0.35)'; ctx.lineWidth = Math.max(0.8, s*0.012); ctx.stroke();
  drawTail(ctx, s, ph, C, o);
}

// ── 手绘有机轮廓 v2（平滑曲线：低频歪扭 + 高频手抖 + 可选趾瓣）──
function organicPath(ctx, rx, ry, seed, o = {}) {
  const r = sRand(seed);
  const low = o.low ?? 0.03, high = o.high ?? 0.012;
  // 频率必须低于采样极限（N=18 点 → <3 周期/圈），否则路径混叠自交叉、nonzero 填充抵消消失
  const f1 = 2 + Math.floor(r() * 2);   // 2~3：形状级歪扭
  const f2 = 3 + Math.floor(r() * 2);   // 3~4：局部鼓瘪
  const p1 = r() * Math.PI * 2, p2 = r() * Math.PI * 2;
  const N = 18, pts = [];
  for (let i = 0; i < N; i++) {
    const t = (i / N) * Math.PI * 2;
    // 椭圆极坐标半径
    const base = (rx * ry) / Math.hypot(ry * Math.cos(t), rx * Math.sin(t));
    let w = 1
      + low * Math.sin(t * f1 + p1)              // 低频：整体歪扭（不是完美椭圆）
      + low * 0.55 * Math.sin(t * f2 + p2)       // 中频：局部鼓/瘪
      + (r() - 0.5) * 2 * high;                  // 高频：手抖线
    if (o.bumps) {                               // 趾瓣：高斯凸起
      for (const [bi, ba, bs] of o.bumps) {
        let d = t - bi;
        while (d > Math.PI) d -= Math.PI * 2;
        while (d < -Math.PI) d += Math.PI * 2;
        w += ba * Math.exp(-(d * d) / (2 * bs * bs));
      }
    }
    pts.push([Math.cos(t) * base * w, Math.sin(t) * base * w]);
  }
  // Catmull-Rom 式平滑闭合（中点二次贝塞尔）：曲线连接，无折线感
  const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  ctx.beginPath();
  const m0 = mid(pts[N - 1], pts[0]);
  ctx.moveTo(m0[0], m0[1]);
  for (let i = 0; i < N; i++) {
    const p = pts[i], q = pts[(i + 1) % N], m = mid(p, q);
    ctx.quadraticCurveTo(p[0], p[1], m[0], m[1]);
  }
  ctx.closePath();
}

/** 复笔描边：同一笔走两遍（宽而淡 + 窄而浓），模拟手绘笔锋的深浅 */
function organicStroke(ctx, C, lw) {
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = C.line;
  ctx.globalAlpha = 0.30; ctx.lineWidth = lw * 1.7; ctx.stroke();
  ctx.globalAlpha = 0.90; ctx.lineWidth = lw;       ctx.stroke();
  ctx.globalAlpha = 1;
}

// ── 风格 B′ v3：B + 全部件有机手绘轮廓 ───────────────
// 缘盾波浪：真实龟壳外缘是一片片缘盾拼成的，轮廓带 12 处棱状微凸（手绘图最显著特征）
const SHELL_BUMPS = (() => {
  const r = sRand(77), arr = [];
  for (let i = 0; i < 12; i++) {
    arr.push([i / 12 * Math.PI * 2 + (r() - 0.5) * 0.16, 0.022 + r() * 0.013, 0.145]);
  }
  return arr;
})();

function shellRough(ctx, s, C) {
  const rx = s*0.56, ry = s*0.46;
  const lw = Math.max(1.1, s*0.022);
  // 缘盾环带（有机外缘 + 缘盾棱波）
  organicPath(ctx, rx, ry, 5, { low: 0.042, high: 0.011, bumps: SHELL_BUMPS });
  ctx.fillStyle = C.band; ctx.fill();
  organicStroke(ctx, C, lw);
  // 中央甲（有机内缘，轻波浪）
  organicPath(ctx, rx*0.80, ry*0.76, 9, { low: 0.034, high: 0.012,
    bumps: SHELL_BUMPS.map(([bi, ba, bs]) => [bi, ba * 0.4, bs]) });
  ctx.fillStyle = C.shell; ctx.fill();
  ctx.strokeStyle = 'rgba(58,49,34,0.5)'; ctx.lineWidth = lw*0.55; ctx.stroke();
  // 椎盾纵条
  organicPath(ctx, s*0.13, ry*0.60, 13, { low: 0.055, high: 0.02 });
  ctx.fillStyle = C.scute; ctx.fill();
  // 盾片缝
  ctx.strokeStyle = 'rgba(0,0,0,0.24)';
  ctx.lineWidth = Math.max(0.8, s*0.011);
  [-1, 1].forEach((sd) => {
    ctx.beginPath(); ctx.moveTo(sd*s*0.17, -ry*0.62);
    ctx.quadraticCurveTo(sd*s*0.22, 0, sd*s*0.17, ry*0.62); ctx.stroke();
  });
  [-0.62, 0, 0.62].forEach((f) => {
    ctx.beginPath(); ctx.moveTo(-rx*0.72, ry*f*0.76);
    ctx.quadraticCurveTo(0, ry*(f*0.76 + 0.08), rx*0.72, ry*f*0.76); ctx.stroke();
  });
  // 三条脊棱
  ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(80,68,38,0.65)'; ctx.lineWidth = Math.max(1.2, s*0.028);
  ctx.beginPath(); ctx.moveTo(0, -ry*0.64); ctx.quadraticCurveTo(0, 0, 0, ry*0.64); ctx.stroke();
  ctx.strokeStyle = 'rgba(175,156,98,0.7)'; ctx.lineWidth = Math.max(0.9, s*0.013);
  ctx.beginPath(); ctx.moveTo(s*0.014, -ry*0.64); ctx.quadraticCurveTo(s*0.014, 0, s*0.014, ry*0.64); ctx.stroke();
  ctx.strokeStyle = 'rgba(80,68,38,0.32)';
  [-1, 1].forEach((sd) => {
    ctx.beginPath(); ctx.moveTo(sd*s*0.15, -ry*0.54);
    ctx.quadraticCurveTo(sd*s*0.17, 0, sd*s*0.15, ry*0.54); ctx.stroke();
  });
  // 生长纹（有机虚线弧）
  ctx.strokeStyle = 'rgba(0,0,0,0.30)'; ctx.lineWidth = Math.max(1, s*0.013);
  ctx.setLineDash([s*0.045, s*0.04]);
  [0.52, 0.64].forEach((f) => {
    organicPath(ctx, rx*0.8*f, ry*0.76*f, 9, { low: 0.05, high: 0.018 });
    ctx.stroke();
  });
  ctx.setLineDash([]);
  // 缘盾片片感：12 片交替明暗弧带（手绘图"一片片甲"的视觉来源）
  const bandW = rx * 0.115;
  for (let i = 0; i < 12; i++) {
    const a0 = (i/12)*Math.PI*2 + 0.10, a1 = ((i+1)/12)*Math.PI*2 - 0.10;
    ctx.beginPath();
    ctx.ellipse(0, 0, rx*0.90, ry*0.885, 0, a0, a1);
    ctx.strokeStyle = i % 2 === 0 ? 'rgba(0,0,0,0.075)' : 'rgba(255,255,255,0.08)';
    ctx.lineWidth = bandW; ctx.lineCap = 'butt'; ctx.stroke();
  }
  // 缘盾辐射
  ctx.strokeStyle = 'rgba(0,0,0,0.26)'; ctx.lineWidth = Math.max(0.8, s*0.010);
  for (let i = 0; i < 14; i++) {
    const a = (i/14)*Math.PI*2 + 0.12;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*rx*0.80, Math.sin(a)*ry*0.76);
    ctx.lineTo(Math.cos(a)*rx*0.97, Math.sin(a)*ry*0.965);
    ctx.stroke();
  }
}

function drawBR(ctx, s, ph) {
  const C = YT;
  // 腿（有机轮廓 + 3 趾瓣凸起朝壳外侧，趾缝线分开）
  const swing = Math.sin(ph) * 0.5;
  const pos = [[s*0.32,-s*0.42],[s*0.32,s*0.42],[-s*0.3,-s*0.42],[-s*0.3,s*0.42]];
  pos.forEach(([lx,ly], i) => {
    const sw = i % 2 === 0 ? swing : -swing;
    ctx.save();
    ctx.translate(lx + sw*s*0.28, ly);
    ctx.rotate(sw*0.4);
    organicPath(ctx, s*0.155, s*0.10, 21 + i*7, {
      low: 0.035, high: 0.016,
      bumps: [[-0.45, 0.20, 0.16], [0.0, 0.23, 0.17], [0.45, 0.20, 0.16]],
    });
    ctx.fillStyle = C.limb; ctx.fill();
    organicStroke(ctx, C, Math.max(1, s*0.017));
    // 趾缝（趾瓣之间向外，画到趾尖外）
    ctx.strokeStyle = 'rgba(0,0,0,0.42)'; ctx.lineWidth = Math.max(0.9, s*0.013); ctx.lineCap = 'round';
    [-0.24, 0.24].forEach((a) => {
      ctx.beginPath(); ctx.moveTo(s*0.105, a*s*0.045);
      ctx.lineTo(s*0.185, a*s*0.115); ctx.stroke();
    });
    // 关节褶线
    ctx.beginPath(); ctx.moveTo(-s*0.05, -s*0.08); ctx.quadraticCurveTo(-s*0.10, 0, -s*0.05, s*0.08);
    ctx.strokeStyle = 'rgba(0,0,0,0.30)'; ctx.lineWidth = Math.max(0.8, s*0.012); ctx.stroke();
    ctx.restore();
  });
  // 头（手绘卵形：吻端略尖伸、后颊宽——黄喉蛇头状特征；中心后移衔接壳缘不断颈）
  const bob = Math.sin(ph*0.66) * s * 0.03;
  const hx = s*0.80, hy = bob;
  ctx.save();
  ctx.translate(hx, hy);   // [BUG FIX] organicPath 以当前原点为中心画椭圆：必须先移到头中心，否则头被画在壳心并被壳体覆盖
  organicPath(ctx, s*0.215, s*0.16, 17, {
    low: 0.034, high: 0.013,
    bumps: [[0, 0.07, 0.5], [2.2, 0.025, 0.5], [-2.2, 0.025, 0.5]],  // 吻端伸 + 两颊微鼓
  });
  ctx.fillStyle = C.head; ctx.fill();
  organicStroke(ctx, C, Math.max(1.1, s*0.024));
  // 黄纹
  [-1, 1].forEach((sd) => {
    ctx.beginPath();
    ctx.moveTo(-s*0.06, sd*s*0.075);
    ctx.quadraticCurveTo(s*0.05, sd*s*0.105, s*0.17, sd*s*0.065);
    ctx.strokeStyle = C.yellow; ctx.lineWidth = s*0.05; ctx.lineCap = 'round'; ctx.stroke();
  });
  // 颈褶
  ctx.strokeStyle = 'rgba(0,0,0,0.28)'; ctx.lineWidth = Math.max(0.8, s*0.011);
  [-1, 1].forEach((sd) => {
    ctx.beginPath();
    ctx.moveTo(-s*0.10, sd*s*0.05);
    ctx.quadraticCurveTo(-s*0.14, sd*s*0.09, -s*0.09, sd*s*0.13);
    ctx.stroke();
  });
  // 头顶碎斑
  const r = sRand(23);
  ctx.fillStyle = 'rgba(0,0,0,0.20)';
  for (let i = 0; i < 5; i++) {
    ctx.beginPath();
    ctx.ellipse(-s*0.02 + r()*s*0.14, -s*0.06 + r()*s*0.12,
                s*0.014 + r()*s*0.012, s*0.010 + r()*s*0.008, r()*3, 0, Math.PI*2);
    ctx.fill();
  }
  // 双眼
  [-1, 1].forEach((sd) => {
    ctx.beginPath(); ctx.arc(s*0.095, sd*s*0.088, Math.max(1.4, s*0.036), 0, Math.PI*2);
    ctx.fillStyle = '#141210'; ctx.fill();
    ctx.beginPath(); ctx.arc(s*0.105, sd*s*(0.088 - 0.012*sd) - s*0.012,
                             Math.max(0.5, s*0.011), 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fill();
  });
  // 嘴缝
  ctx.beginPath(); ctx.moveTo(s*0.185, 0);
  ctx.quadraticCurveTo(s*0.14, s*0.035, s*0.09, s*0.03);
  ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = Math.max(0.8, s*0.012); ctx.stroke();
  ctx.restore();
  shellRough(ctx, s, C);
  // 尾（有机曲线：点列 + 平滑闭合）
  ctx.save();
  ctx.rotate(Math.sin(ph*0.8) * 0.08);
  const rr = sRand(31);
  const tp = [
    [-s*0.50, -s*0.05], [-s*0.60, -s*0.085 + rr()*s*0.012], [-s*0.70, -s*0.05],
    [-s*0.745, rr()*s*0.014], [-s*0.70, s*0.045], [-s*0.60, s*0.075 + rr()*s*0.012],
    [-s*0.50, s*0.05],
  ];
  const mid2 = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  ctx.beginPath();
  const tm0 = mid2(tp[tp.length - 1], tp[0]);
  ctx.moveTo(tm0[0], tm0[1]);
  for (let i = 0; i < tp.length; i++) {
    const p = tp[i], q = tp[(i + 1) % tp.length], m2 = mid2(p, q);
    ctx.quadraticCurveTo(p[0], p[1], m2[0], m2[1]);
  }
  ctx.closePath();
  ctx.fillStyle = C.limb; ctx.fill();
  organicStroke(ctx, C, Math.max(1, s*0.016));
  ctx.restore();
}

// ── 可爱风（介于写实与 AI 插画之间）：参数化三档 E/F/G ──
// round: 0~1 壳/头圆润度；kawaii: 0~1 眼睛放大与高光档位；blush/smile: 萌系表情
function cutePalette(o) {
  return Object.assign({
    shell: '#8a7a44', band: '#b09a58', scute: '#967f4c', limb: '#6e5c34',
    head: '#a3924c', yellow: '#f0d95e', line: '#4a3d26',
  }, o);
}

function shellCute(ctx, s, C, round) {
  const rx = s*(0.56 - 0.02*round), ry = s*(0.46 + 0.05*round);
  const lw = Math.max(1.1, s*0.022);
  const bumpAmp = 1 - 0.45*round;   // 越可爱缘盾棱越柔和
  organicPath(ctx, rx, ry, 5, { low: 0.042 - 0.012*round, high: 0.011,
    bumps: SHELL_BUMPS.map(([bi, ba, bs]) => [bi, ba*bumpAmp, bs]) });
  ctx.fillStyle = C.band; ctx.fill();
  organicStroke(ctx, C, lw);
  organicPath(ctx, rx*0.80, ry*0.76, 9, { low: 0.034, high: 0.012,
    bumps: SHELL_BUMPS.map(([bi, ba, bs]) => [bi, ba*0.4*bumpAmp, bs]) });
  ctx.fillStyle = C.shell; ctx.fill();
  ctx.strokeStyle = 'rgba(74,61,38,0.45)'; ctx.lineWidth = lw*0.55; ctx.stroke();
  // 椎盾纵条
  organicPath(ctx, s*0.13, ry*0.60, 13, { low: 0.055, high: 0.02 });
  ctx.fillStyle = C.scute; ctx.fill();
  // 盾片缝（柔化）
  ctx.strokeStyle = 'rgba(60,48,28,0.20)';
  ctx.lineWidth = Math.max(0.8, s*0.011);
  [-1, 1].forEach((sd) => {
    ctx.beginPath(); ctx.moveTo(sd*s*0.17, -ry*0.62);
    ctx.quadraticCurveTo(sd*s*0.22, 0, sd*s*0.17, ry*0.62); ctx.stroke();
  });
  [-0.62, 0, 0.62].forEach((f) => {
    ctx.beginPath(); ctx.moveTo(-rx*0.72, ry*f*0.76);
    ctx.quadraticCurveTo(0, ry*(f*0.76 + 0.08), rx*0.72, ry*f*0.76); ctx.stroke();
  });
  // 脊棱（单条柔化）
  ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(96,80,44,0.45)'; ctx.lineWidth = Math.max(1.2, s*0.028);
  ctx.beginPath(); ctx.moveTo(0, -ry*0.64); ctx.quadraticCurveTo(0, 0, 0, ry*0.64); ctx.stroke();
  // 生长纹（有机虚线弧）
  ctx.strokeStyle = 'rgba(60,48,28,0.22)'; ctx.lineWidth = Math.max(1, s*0.013);
  ctx.setLineDash([s*0.045, s*0.04]);
  [0.52, 0.64].forEach((f) => {
    organicPath(ctx, rx*0.8*f, ry*0.76*f, 9, { low: 0.05, high: 0.018 });
    ctx.stroke();
  });
  ctx.setLineDash([]);
  // 缘盾明暗（对比降低）
  const bandW = rx * 0.115;
  for (let i = 0; i < 12; i++) {
    const a0 = (i/12)*Math.PI*2 + 0.10, a1 = ((i+1)/12)*Math.PI*2 - 0.10;
    ctx.beginPath();
    ctx.ellipse(0, 0, rx*0.90, ry*0.885, 0, a0, a1);
    ctx.strokeStyle = i % 2 === 0 ? 'rgba(0,0,0,0.05)' : 'rgba(255,255,255,0.10)';
    ctx.lineWidth = bandW; ctx.lineCap = 'butt'; ctx.stroke();
  }
  // AI 插画感：左上受光高光弧
  if (round > 0.4) {
    ctx.strokeStyle = 'rgba(255,250,235,0.30)'; ctx.lineWidth = s*0.035; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.ellipse(0, 0, rx*0.60, ry*0.52, -0.55, Math.PI*0.95, Math.PI*1.45);
    ctx.stroke();
  }
}

function drawCute(ctx, s, ph, P) {
  const C = P.C, round = P.round, kw = P.kawaii;
  // 四肢：更短更圆，趾瓣收敛
  const swing = Math.sin(ph) * 0.5;
  const pos = [[s*0.30,-s*0.40],[s*0.30,s*0.40],[-s*0.28,-s*0.40],[-s*0.28,s*0.40]];
  pos.forEach(([lx,ly], i) => {
    const sw = i % 2 === 0 ? swing : -swing;
    ctx.save();
    ctx.translate(lx + sw*s*0.24, ly);
    ctx.rotate(sw*0.4);
    const toe = 0.20 - 0.06*round;
    organicPath(ctx, s*0.145, s*0.095, 21 + i*7, {
      low: 0.03, high: 0.012,
      bumps: [[-0.45, toe, 0.18], [0.0, toe + 0.02, 0.19], [0.45, toe, 0.18]],
    });
    ctx.fillStyle = C.limb; ctx.fill();
    organicStroke(ctx, C, Math.max(1, s*0.017));
    if (kw < 1) { // 奶萌版省略趾缝线，更圆润
      ctx.strokeStyle = 'rgba(0,0,0,0.30)'; ctx.lineWidth = Math.max(0.9, s*0.012); ctx.lineCap = 'round';
      [-0.24, 0.24].forEach((a) => {
        ctx.beginPath(); ctx.moveTo(s*0.10, a*s*0.045);
        ctx.lineTo(s*0.16, a*s*0.10); ctx.stroke();
      });
    }
    ctx.restore();
  });
  // 头：更大更圆（有机轮廓仍以当前原点为中心——先 translate）
  const bob = Math.sin(ph*0.66) * s * 0.03;
  const hx = s*(0.76 - 0.04*round), hy = bob;
  ctx.save();
  ctx.translate(hx, hy);
  organicPath(ctx, s*(0.215 + 0.045*round), s*(0.16 + 0.05*round), 17, {
    low: 0.03, high: 0.011,
    bumps: kw >= 1
      ? [[0, 0.10, 0.55], [2.4, 0.035, 0.6], [-2.4, 0.035, 0.6]]   // 吻端圆钝
      : [[0, 0.075, 0.5], [2.2, 0.02, 0.5], [-2.2, 0.02, 0.5]],
  });
  ctx.fillStyle = C.head; ctx.fill();
  organicStroke(ctx, C, Math.max(1.1, s*(0.022 + 0.004*kw)));
  // 眼后黄纹（短而柔和）
  [-1, 1].forEach((sd) => {
    ctx.beginPath();
    ctx.moveTo(-s*0.05, sd*s*0.07);
    ctx.quadraticCurveTo(s*0.04, sd*s*0.10, s*0.15, sd*s*0.06);
    ctx.strokeStyle = C.yellow; ctx.lineWidth = s*0.05; ctx.lineCap = 'round'; ctx.stroke();
  });
  if (P.blush) { // 腮红
    [-1, 1].forEach((sd) => {
      ctx.beginPath();
      ctx.ellipse(-s*0.02, sd*s*0.105, s*0.055, s*0.032, 0, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(238,140,115,0.30)'; ctx.fill();
    });
  }
  // 双眼：大而亮
  [-1, 1].forEach((sd) => {
    ctx.beginPath(); ctx.arc(s*0.085, sd*s*0.082, Math.max(1.8, s*0.036*(1 + 0.5*kw)), 0, Math.PI*2);
    ctx.fillStyle = '#221c12'; ctx.fill();
    ctx.beginPath(); ctx.arc(s*0.093, sd*s*0.082 - s*0.014*(1 + 0.3*kw), Math.max(0.9, s*0.014*(1 + 0.4*kw)), 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.92)'; ctx.fill();
    if (kw >= 1) { // 第二高光
      ctx.beginPath(); ctx.arc(s*0.075, sd*s*0.082 + s*0.012, Math.max(0.5, s*0.006), 0, Math.PI*2);
      ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.fill();
    }
  });
  // 嘴：微笑弧 + 鼻孔（写实档保留直嘴缝）
  if (P.smile) {
    ctx.beginPath(); ctx.moveTo(s*0.155, s*0.012);
    ctx.quadraticCurveTo(s*0.12, s*0.045, s*0.075, s*0.028);
    ctx.strokeStyle = 'rgba(70,52,30,0.55)'; ctx.lineWidth = Math.max(0.9, s*0.013); ctx.lineCap = 'round'; ctx.stroke();
    [-1, 1].forEach((sd) => {
      ctx.beginPath(); ctx.arc(s*0.175, sd*s*0.016, Math.max(0.5, s*0.006), 0, Math.PI*2);
      ctx.fillStyle = 'rgba(70,52,30,0.55)'; ctx.fill();
    });
  } else {
    ctx.beginPath(); ctx.moveTo(s*0.185, 0);
    ctx.quadraticCurveTo(s*0.14, s*0.035, s*0.09, s*0.03);
    ctx.strokeStyle = 'rgba(0,0,0,0.40)'; ctx.lineWidth = Math.max(0.8, s*0.012); ctx.stroke();
  }
  ctx.restore();
  shellCute(ctx, s, C, round);
  // 尾：更短更圆
  ctx.save();
  ctx.rotate(Math.sin(ph*0.8) * 0.08);
  const rr = sRand(31);
  const tlen = 1 - 0.25*round;
  const tp = [
    [-s*0.50, -s*0.05], [-s*(0.50 + 0.10*tlen), -s*0.08 + rr()*s*0.012], [-s*(0.50 + 0.20*tlen), -s*0.045],
    [-s*(0.50 + 0.245*tlen), rr()*s*0.014], [-s*(0.50 + 0.20*tlen), s*0.04], [-s*(0.50 + 0.10*tlen), s*0.07 + rr()*s*0.012],
    [-s*0.50, s*0.05],
  ];
  const mid2 = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  ctx.beginPath();
  const tm0 = mid2(tp[tp.length - 1], tp[0]);
  ctx.moveTo(tm0[0], tm0[1]);
  for (let i = 0; i < tp.length; i++) {
    const p = tp[i], q2 = tp[(i + 1) % tp.length], m2 = mid2(p, q2);
    ctx.quadraticCurveTo(p[0], p[1], m2[0], m2[1]);
  }
  ctx.closePath();
  ctx.fillStyle = C.limb; ctx.fill();
  organicStroke(ctx, C, Math.max(1, s*0.016));
  ctx.restore();
}

// ── 可爱风 v2：按参考图 4 大类各做一版（保留黄喉特征：黄纵纹 + 橄榄棕壳）──
const KEMOI = {
  d3: { shell:'#a8894c', shellHi:'#e0cd92', limb:'#93a45e', limbHi:'#c6d194',
        head:'#9fae66', headHi:'#d2d9a0', yellow:'#f2dc6a', line:'#5a4a2c',
        blush:'rgba(240,150,120,0.35)' },
  sticker: { shell:'#c9a068', shellEdge:'#a5814e', limb:'#b8cc9a', head:'#c2d4a2',
             yellow:'#f0d75e', line:'#8a6a42' },
  flat: { shellTop:'#b5c48a', shellRim:'#7d8455', skin:'#cdd8a8',
          yellow:'#eeda6e', seam:'rgba(255,255,255,0.38)' },
  album: { shell:'#b8924e', band:'#8f6f3c', limb:'#8a8a50', head:'#9aa45e',
           yellow:'#f0d75e', line:'#3e3220' },
};

// 白色贴纸描边：先粗白再细棕（水彩贴纸风的部件级白边）
function stickerStroke(ctx, s, lineC) {
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = Math.max(2.4, s*0.032); ctx.stroke();
  ctx.strokeStyle = lineC;     ctx.lineWidth = Math.max(0.9, s*0.011); ctx.stroke();
}

// H · 3D 萌渲染（参考：3D 渲染萌系两张）——径向渐变体积 + 超大眼多层高光 + w 嘴
function drawK3d(ctx, s, ph) {
  const C = KEMOI.d3;
  // 底部软阴影（体积感）
  ctx.fillStyle = 'rgba(90,70,40,0.12)';
  ctx.beginPath(); ctx.ellipse(0, s*0.06, s*0.63, s*0.53, 0, 0, Math.PI*2); ctx.fill();
  // 四肢：短圆 + 渐变
  const swing = Math.sin(ph)*0.45;
  [[s*0.30,-s*0.40],[s*0.30,s*0.40],[-s*0.28,-s*0.40],[-s*0.28,s*0.40]].forEach(([lx,ly],i)=>{
    const sw = i%2===0 ? swing : -swing;
    ctx.save(); ctx.translate(lx+sw*s*0.22, ly); ctx.rotate(sw*0.4);
    organicPath(ctx, s*0.14, s*0.095, 21+i*7, { low:0.025, high:0.008,
      bumps:[[-0.45,0.10,0.20],[0.0,0.12,0.21],[0.45,0.10,0.20]] });
    const g = ctx.createRadialGradient(-s*0.04,-s*0.03,s*0.02, 0,0,s*0.16);
    g.addColorStop(0, C.limbHi); g.addColorStop(1, C.limb);
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = C.line; ctx.lineWidth = Math.max(1, s*0.014); ctx.stroke();
    ctx.restore();
  });
  // 头：大圆 + 3D 渐变（先 translate 再画有机轮廓）
  const bob = Math.sin(ph*0.66)*s*0.03;
  ctx.save(); ctx.translate(s*0.70, bob);
  organicPath(ctx, s*0.26, s*0.225, 17, { low:0.022, high:0.008, bumps:[[0,0.06,0.6]] });
  const hg = ctx.createRadialGradient(-s*0.06,-s*0.06,s*0.03, 0,0,s*0.30);
  hg.addColorStop(0, C.headHi); hg.addColorStop(1, C.head);
  ctx.fillStyle = hg; ctx.fill();
  ctx.strokeStyle = C.line; ctx.lineWidth = Math.max(1.1, s*0.016); ctx.stroke();
  // 黄喉黄纵纹
  [-1,1].forEach((sd)=>{ ctx.beginPath();
    ctx.moveTo(-s*0.02, sd*s*0.085); ctx.quadraticCurveTo(s*0.06, sd*s*0.115, s*0.16, sd*s*0.075);
    ctx.strokeStyle = C.yellow; ctx.lineWidth = s*0.045; ctx.lineCap='round'; ctx.stroke(); });
  // 腮红
  [-1,1].forEach((sd)=>{ ctx.beginPath();
    ctx.ellipse(-s*0.05, sd*s*0.12, s*0.06, s*0.035, 0, 0, Math.PI*2);
    ctx.fillStyle = C.blush; ctx.fill(); });
  // 超大眼 + 双层高光
  [-1,1].forEach((sd)=>{
    ctx.beginPath(); ctx.arc(s*0.115, sd*s*0.095, s*0.052, 0, Math.PI*2);
    ctx.fillStyle = '#2a2018'; ctx.fill();
    ctx.beginPath(); ctx.arc(s*0.135, sd*s*0.095 - s*0.018, s*0.020, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.95)'; ctx.fill();
    ctx.beginPath(); ctx.arc(s*0.098, sd*s*0.095 + s*0.016, s*0.009, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.65)'; ctx.fill();
  });
  // w 嘴 + 鼻孔
  ctx.beginPath(); ctx.moveTo(s*0.20, s*0.01);
  ctx.quadraticCurveTo(s*0.17, s*0.035, s*0.135, s*0.02);
  ctx.quadraticCurveTo(s*0.105, s*0.035, s*0.075, s*0.018);
  ctx.strokeStyle = C.line; ctx.lineWidth = Math.max(1, s*0.012); ctx.lineCap='round'; ctx.stroke();
  [-1,1].forEach((sd)=>{ ctx.beginPath(); ctx.arc(s*0.205, sd*s*0.02, s*0.007, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(60,45,25,0.5)'; ctx.fill(); });
  ctx.restore();
  // 壳：径向渐变 + 奶油环带 + 高光弧
  organicPath(ctx, s*0.54, s*0.50, 5, { low:0.03, high:0.008,
    bumps: SHELL_BUMPS.map(([bi,ba,bs])=>[bi, ba*0.5, bs]) });
  const sg = ctx.createRadialGradient(-s*0.15,-s*0.18,s*0.05, 0,0,s*0.62);
  sg.addColorStop(0, C.shellHi); sg.addColorStop(1, C.shell);
  ctx.fillStyle = sg; ctx.fill();
  ctx.strokeStyle = C.line; ctx.lineWidth = Math.max(1.2, s*0.018); ctx.stroke();
  organicPath(ctx, s*0.475, s*0.435, 5, { low:0.03, high:0.008,
    bumps: SHELL_BUMPS.map(([bi,ba,bs])=>[bi, ba*0.35, bs]) });
  ctx.strokeStyle = 'rgba(255,250,230,0.5)'; ctx.lineWidth = s*0.03; ctx.stroke();
  // 简化盾片缝
  ctx.strokeStyle = 'rgba(90,74,44,0.4)'; ctx.lineWidth = Math.max(0.9, s*0.011);
  ctx.beginPath(); ctx.moveTo(0,-s*0.30); ctx.quadraticCurveTo(0,0,0,s*0.30); ctx.stroke();
  [-0.5,0,0.5].forEach((f)=>{ ctx.beginPath();
    ctx.moveTo(-s*0.26, s*0.30*f); ctx.quadraticCurveTo(0, s*(0.30*f+0.05), s*0.26, s*0.30*f); ctx.stroke(); });
  // 高光弧（3D 感来源）
  ctx.strokeStyle = 'rgba(255,252,240,0.65)'; ctx.lineWidth = s*0.045; ctx.lineCap='round';
  ctx.beginPath(); ctx.ellipse(0, 0, s*0.34, s*0.29, -0.5, Math.PI*1.02, Math.PI*1.42); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,252,240,0.35)'; ctx.lineWidth = s*0.02;
  ctx.beginPath(); ctx.ellipse(0, 0, s*0.34, s*0.29, -0.5, Math.PI*1.45, Math.PI*1.55); ctx.stroke();
  // 尾
  ctx.save(); ctx.translate(-s*0.555, 0); ctx.rotate(Math.sin(ph*0.8)*0.1);
  organicPath(ctx, s*0.10, s*0.07, 31, { low:0.03, high:0.01 });
  const tg = ctx.createLinearGradient(0,-s*0.07,0,s*0.07);
  tg.addColorStop(0, C.limbHi); tg.addColorStop(1, C.limb);
  ctx.fillStyle = tg; ctx.fill();
  ctx.strokeStyle = C.line; ctx.lineWidth = Math.max(1, s*0.014); ctx.stroke();
  ctx.restore();
}

// I · 水彩贴纸（参考：水彩贴纸 Q 版四张）——部件级白描边 + 暖棕圆顶壳 + 豆眼
function drawKsticker(ctx, s, ph) {
  const C = KEMOI.sticker;
  const swing = Math.sin(ph)*0.45;
  [[s*0.29,-s*0.395],[s*0.29,s*0.395],[-s*0.27,-s*0.395],[-s*0.27,s*0.395]].forEach(([lx,ly],i)=>{
    const sw = i%2===0 ? swing : -swing;
    ctx.save(); ctx.translate(lx+sw*s*0.22, ly); ctx.rotate(sw*0.4);
    organicPath(ctx, s*0.135, s*0.09, 21+i*7, { low:0.028, high:0.010,
      bumps:[[-0.45,0.13,0.19],[0.0,0.15,0.20],[0.45,0.13,0.19]] });
    ctx.fillStyle = C.limb; ctx.fill();
    stickerStroke(ctx, s, C.line);
    ctx.restore();
  });
  // 头
  const bob = Math.sin(ph*0.66)*s*0.03;
  ctx.save(); ctx.translate(s*0.71, bob);
  organicPath(ctx, s*0.245, s*0.21, 17, { low:0.025, high:0.009, bumps:[[0,0.06,0.55]] });
  ctx.fillStyle = C.head; ctx.fill();
  stickerStroke(ctx, s, C.line);
  // 黄纵纹（黄喉特征）
  [-1,1].forEach((sd)=>{ ctx.beginPath();
    ctx.moveTo(-s*0.03, sd*s*0.08); ctx.quadraticCurveTo(s*0.05, sd*s*0.105, s*0.15, sd*s*0.065);
    ctx.strokeStyle = C.yellow; ctx.lineWidth = s*0.042; ctx.lineCap='round'; ctx.stroke(); });
  // 腮红
  [-1,1].forEach((sd)=>{ ctx.beginPath();
    ctx.ellipse(-s*0.06, sd*s*0.11, s*0.05, s*0.03, 0, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(240,150,120,0.32)'; ctx.fill(); });
  // 豆眼 + 白点
  [-1,1].forEach((sd)=>{
    ctx.beginPath(); ctx.arc(s*0.10, sd*s*0.088, s*0.024, 0, Math.PI*2);
    ctx.fillStyle = '#2a2018'; ctx.fill();
    ctx.beginPath(); ctx.arc(s*0.108, sd*s*0.088 - s*0.008, s*0.008, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.fill();
  });
  // 微笑 + 鼻孔
  ctx.beginPath(); ctx.moveTo(s*0.16, s*0.012);
  ctx.quadraticCurveTo(s*0.125, s*0.04, s*0.09, s*0.024);
  ctx.strokeStyle = C.line; ctx.lineWidth = Math.max(0.9, s*0.011); ctx.lineCap='round'; ctx.stroke();
  ctx.beginPath(); ctx.arc(s*0.175, s*0.018, s*0.006, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(90,60,30,0.45)'; ctx.fill();
  ctx.restore();
  // 壳：暖棕圆顶 + 奶油裙边 + 简化盾缝 + 白边
  organicPath(ctx, s*0.545, s*0.505, 5, { low:0.03, high:0.008,
    bumps: SHELL_BUMPS.map(([bi,ba,bs])=>[bi, ba*0.45, bs]) });
  ctx.fillStyle = C.shell; ctx.fill();
  stickerStroke(ctx, s, C.line);
  organicPath(ctx, s*0.465, s*0.425, 5, { low:0.03, high:0.008,
    bumps: SHELL_BUMPS.map(([bi,ba,bs])=>[bi, ba*0.3, bs]) });
  ctx.fillStyle = C.shellEdge; ctx.fill();
  organicPath(ctx, s*0.42, s*0.38, 9, { low:0.03, high:0.01 });
  ctx.fillStyle = C.shell; ctx.fill();
  // 盾缝（简化）
  ctx.strokeStyle = 'rgba(110,80,45,0.5)'; ctx.lineWidth = Math.max(0.9, s*0.011);
  ctx.beginPath(); ctx.moveTo(0,-s*0.26); ctx.quadraticCurveTo(0,0,0,s*0.26); ctx.stroke();
  [-0.45,0,0.45].forEach((f)=>{ ctx.beginPath();
    ctx.moveTo(-s*0.22, s*0.27*f); ctx.quadraticCurveTo(0, s*(0.27*f+0.045), s*0.22, s*0.27*f); ctx.stroke(); });
  // 尾
  ctx.save(); ctx.translate(-s*0.545, 0); ctx.rotate(Math.sin(ph*0.8)*0.1);
  organicPath(ctx, s*0.095, s*0.065, 31, { low:0.03, high:0.01 });
  ctx.fillStyle = C.limb; ctx.fill();
  stickerStroke(ctx, s, C.line);
  ctx.restore();
}

// J · 奶油扁平（参考：日式扁平奶油两张）——无描边纯色块 + 裙边壳 + 豆眼 v 嘴
function drawKflat(ctx, s, ph) {
  const C = KEMOI.flat;
  const swing = Math.sin(ph)*0.45;
  [[s*0.29,-s*0.395],[s*0.29,s*0.395],[-s*0.27,-s*0.395],[-s*0.27,s*0.395]].forEach(([lx,ly],i)=>{
    const sw = i%2===0 ? swing : -swing;
    ctx.save(); ctx.translate(lx+sw*s*0.22, ly); ctx.rotate(sw*0.4);
    organicPath(ctx, s*0.13, s*0.088, 21+i*7, { low:0.022, high:0.008,
      bumps:[[-0.45,0.10,0.20],[0.0,0.12,0.21],[0.45,0.10,0.20]] });
    ctx.fillStyle = C.skin; ctx.fill();
    ctx.restore();
  });
  // 头（无描边）
  const bob = Math.sin(ph*0.66)*s*0.03;
  ctx.save(); ctx.translate(s*0.71, bob);
  organicPath(ctx, s*0.24, s*0.205, 17, { low:0.02, high:0.007, bumps:[[0,0.05,0.55]] });
  ctx.fillStyle = C.skin; ctx.fill();
  // 黄纵纹（黄喉特征，淡）
  [-1,1].forEach((sd)=>{ ctx.beginPath();
    ctx.moveTo(-s*0.03, sd*s*0.078); ctx.quadraticCurveTo(s*0.05, sd*s*0.10, s*0.145, sd*s*0.062);
    ctx.strokeStyle = C.yellow; ctx.lineWidth = s*0.04; ctx.lineCap='round'; ctx.stroke(); });
  // 腮红
  [-1,1].forEach((sd)=>{ ctx.beginPath();
    ctx.ellipse(-s*0.06, sd*s*0.105, s*0.048, s*0.028, 0, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(242,158,128,0.35)'; ctx.fill(); });
  // 豆眼 + v 嘴
  [-1,1].forEach((sd)=>{
    ctx.beginPath(); ctx.arc(s*0.10, sd*s*0.085, s*0.021, 0, Math.PI*2);
    ctx.fillStyle = '#332a1c'; ctx.fill();
    ctx.beginPath(); ctx.arc(s*0.107, sd*s*0.085 - s*0.007, s*0.007, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fill();
  });
  ctx.beginPath(); ctx.moveTo(s*0.155, s*0.014);
  ctx.quadraticCurveTo(s*0.125, s*0.038, s*0.095, s*0.024);
  ctx.strokeStyle = 'rgba(80,60,35,0.55)'; ctx.lineWidth = Math.max(0.9, s*0.010); ctx.lineCap='round'; ctx.stroke();
  ctx.restore();
  // 壳：外裙边深橄榄 + 内盘浅绿黄 + 淡缝线（扁平两色）
  organicPath(ctx, s*0.545, s*0.505, 5, { low:0.028, high:0.007,
    bumps: SHELL_BUMPS.map(([bi,ba,bs])=>[bi, ba*0.4, bs]) });
  ctx.fillStyle = C.shellRim; ctx.fill();
  organicPath(ctx, s*0.44, s*0.40, 5, { low:0.028, high:0.007,
    bumps: SHELL_BUMPS.map(([bi,ba,bs])=>[bi, ba*0.28, bs]) });
  ctx.fillStyle = C.shellTop; ctx.fill();
  // 淡缝线
  ctx.strokeStyle = C.seam; ctx.lineWidth = Math.max(0.9, s*0.011);
  ctx.beginPath(); ctx.moveTo(0,-s*0.24); ctx.quadraticCurveTo(0,0,0,s*0.24); ctx.stroke();
  [-0.45,0,0.45].forEach((f)=>{ ctx.beginPath();
    ctx.moveTo(-s*0.20, s*0.25*f); ctx.quadraticCurveTo(0, s*(0.25*f+0.04), s*0.20, s*0.25*f); ctx.stroke(); });
  // 尾
  ctx.save(); ctx.translate(-s*0.545, 0); ctx.rotate(Math.sin(ph*0.8)*0.1);
  organicPath(ctx, s*0.09, s*0.062, 31, { low:0.025, high:0.008 });
  ctx.fillStyle = C.skin; ctx.fill();
  ctx.restore();
}

// K · 绘本水彩（参考：蛇叔盘龟龟系列）——白圈大眼 + 蜂蜜壳放射纹 + 头背碎纹 + 水彩晕斑
function drawKalbum(ctx, s, ph) {
  const C = KEMOI.album;
  const swing = Math.sin(ph)*0.45;
  [[s*0.30,-s*0.40],[s*0.30,s*0.40],[-s*0.28,-s*0.40],[-s*0.28,s*0.40]].forEach(([lx,ly],i)=>{
    const sw = i%2===0 ? swing : -swing;
    ctx.save(); ctx.translate(lx+sw*s*0.23, ly); ctx.rotate(sw*0.4);
    organicPath(ctx, s*0.14, s*0.092, 21+i*7, { low:0.03, high:0.010,
      bumps:[[-0.45,0.15,0.19],[0.0,0.17,0.20],[0.45,0.15,0.19]] });
    ctx.fillStyle = C.limb; ctx.fill();
    ctx.strokeStyle = C.line; ctx.lineWidth = Math.max(1, s*0.013); ctx.stroke();
    // 鳞纹小弧
    ctx.strokeStyle = 'rgba(60,50,25,0.30)'; ctx.lineWidth = Math.max(0.7, s*0.008);
    [-0.04, 0.03].forEach((f)=>{ ctx.beginPath();
      ctx.arc(-s*0.02, f*s*0.06, s*0.045, -0.6, 0.6); ctx.stroke(); });
    ctx.restore();
  });
  // 头
  const bob = Math.sin(ph*0.66)*s*0.03;
  ctx.save(); ctx.translate(s*0.705, bob);
  organicPath(ctx, s*0.25, s*0.215, 17, { low:0.024, high:0.009, bumps:[[0,0.06,0.55]] });
  ctx.fillStyle = C.head; ctx.fill();
  ctx.strokeStyle = C.line; ctx.lineWidth = Math.max(1.1, s*0.015); ctx.stroke();
  // 黄纵纹（黄喉特征，粗）
  [-1,1].forEach((sd)=>{ ctx.beginPath();
    ctx.moveTo(-s*0.02, sd*s*0.085); ctx.quadraticCurveTo(s*0.06, sd*s*0.115, s*0.16, sd*s*0.072);
    ctx.strokeStyle = C.yellow; ctx.lineWidth = s*0.05; ctx.lineCap='round'; ctx.stroke(); });
  // 头背碎纹（黄喉成体虫纹）
  const rs = sRand(23);
  ctx.strokeStyle = 'rgba(60,50,25,0.30)'; ctx.lineWidth = Math.max(0.7, s*0.007);
  for (let i=0;i<6;i++){ const x=-s*0.10+rs()*s*0.13, y=-s*0.11+rs()*s*0.20, r1=s*0.02+rs()*s*0.02;
    ctx.beginPath(); ctx.arc(x, y, r1, rs()*6, rs()*6+2.5); ctx.stroke(); }
  // 腮红
  [-1,1].forEach((sd)=>{ ctx.beginPath();
    ctx.ellipse(-s*0.05, sd*s*0.115, s*0.05, s*0.03, 0, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(238,140,110,0.28)'; ctx.fill(); });
  // 白圈大眼（绘本标志）
  [-1,1].forEach((sd)=>{
    ctx.beginPath(); ctx.ellipse(s*0.10, sd*s*0.09, s*0.048, s*0.044, 0, 0, Math.PI*2);
    ctx.fillStyle = '#f6f1e2'; ctx.fill();
    ctx.strokeStyle = C.line; ctx.lineWidth = Math.max(0.8, s*0.009); ctx.stroke();
    ctx.beginPath(); ctx.arc(s*0.108, sd*s*0.09, s*0.030, 0, Math.PI*2);
    ctx.fillStyle = '#241c10'; ctx.fill();
    ctx.beginPath(); ctx.arc(s*0.12, sd*s*0.09 - s*0.011, s*0.011, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.95)'; ctx.fill();
    ctx.beginPath(); ctx.arc(s*0.095, sd*s*0.09 + s*0.012, s*0.005, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fill();
  });
  // 微笑 + 鼻孔
  ctx.beginPath(); ctx.moveTo(s*0.165, s*0.012);
  ctx.quadraticCurveTo(s*0.13, s*0.042, s*0.09, s*0.026);
  ctx.strokeStyle = C.line; ctx.lineWidth = Math.max(1, s*0.012); ctx.lineCap='round'; ctx.stroke();
  [-1,1].forEach((sd)=>{ ctx.beginPath(); ctx.arc(s*0.185, sd*s*0.016, s*0.006, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(60,45,25,0.5)'; ctx.fill(); });
  ctx.restore();
  // 壳：蜂蜜底 + 水彩晕斑 + 放射细纹 + 缘盾深斑带
  organicPath(ctx, s*0.545, s*0.505, 5, { low:0.03, high:0.008,
    bumps: SHELL_BUMPS.map(([bi,ba,bs])=>[bi, ba*0.5, bs]) });
  ctx.fillStyle = C.shell; ctx.fill();
  ctx.strokeStyle = C.line; ctx.lineWidth = Math.max(1.2, s*0.016); ctx.stroke();
  const rw = sRand(47);
  for (let i=0;i<3;i++){ ctx.beginPath();
    ctx.ellipse((rw()-0.5)*s*0.5, (rw()-0.5)*s*0.4, s*(0.18+rw()*0.15), s*(0.12+rw()*0.12), rw()*3, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(120,95,50,0.08)'; ctx.fill(); }
  // 放射细纹（黄喉甲纹特征）
  ctx.strokeStyle = 'rgba(70,50,26,0.5)'; ctx.lineWidth = Math.max(0.8, s*0.008);
  for (let i=0;i<10;i++){ const a=i/10*Math.PI*2+0.3;
    ctx.beginPath(); ctx.moveTo(Math.cos(a)*s*0.10, Math.sin(a)*s*0.09);
    ctx.quadraticCurveTo(Math.cos(a+0.15)*s*0.28, Math.sin(a+0.15)*s*0.25, Math.cos(a)*s*0.43, Math.sin(a)*s*0.39);
    ctx.stroke(); }
  // 缘盾深斑带
  for (let i=0;i<12;i++){ const a=i/12*Math.PI*2;
    ctx.beginPath(); ctx.ellipse(Math.cos(a)*s*0.475, Math.sin(a)*s*0.435, s*0.05, s*0.04, a, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(60,42,20,0.28)'; ctx.fill(); }
  // 中央盾缝
  ctx.strokeStyle = 'rgba(70,52,28,0.45)'; ctx.lineWidth = Math.max(0.9, s*0.010);
  ctx.beginPath(); ctx.moveTo(0,-s*0.27); ctx.quadraticCurveTo(0,0,0,s*0.27); ctx.stroke();
  // 尾
  ctx.save(); ctx.translate(-s*0.55, 0); ctx.rotate(Math.sin(ph*0.8)*0.1);
  organicPath(ctx, s*0.095, s*0.065, 31, { low:0.03, high:0.01 });
  ctx.fillStyle = C.limb; ctx.fill();
  ctx.strokeStyle = C.line; ctx.lineWidth = Math.max(1, s*0.013); ctx.stroke();
  ctx.restore();
}

// ── 侧面视角可爱版 v3：侧视 · 大头萌化 · 对应参考图 4 档 ──────
// 鱼本来就是侧视（身体椭圆 + 尾摆 + 单眼白圈），龟改侧视后同屏朝向一致；
// 头放大到 1.15~1.22 倍强化萌感，四档共用同一套参数化几何，只是配色/描边/渐变/细节不同。
const SIDE_PAL = {
  h: { shell: '#a8894c', shellHi: '#e8d79d', rim: '#8f7440', limb: '#93a45e', limbHi: '#c9d49a',
       head: '#9fae66', headHi: '#dae0a8', yellow: '#f2dc6a', line: '#584a2c',
       blush: 'rgba(240,150,120,0.38)' },
  i: { shell: '#c9a068', shellHi: '#e8cb9c', rim: '#a5814e', limb: '#b8cc9a', limbHi: '#d8e4ba',
       head: '#c2d4a2', headHi: '#deecc6', yellow: '#f0d75e', line: '#8a6a42',
       blush: 'rgba(235,150,120,0.30)' },
  j: { shell: '#b5c48a', shellHi: '#cdd9a6', rim: '#7d8455', limb: '#cdd8a8', limbHi: '#e0e8c2',
       head: '#cdd8a8', headHi: '#e2eac6', yellow: '#eeda6e', line: 'rgba(96,102,64,0.9)',
       blush: null },
  k: { shell: '#b8924e', shellHi: '#dec388', rim: '#8f6f3c', limb: '#8a8a50', limbHi: '#a8a870',
       head: '#9aa45e', headHi: '#c4cb8c', yellow: '#f0d75e', line: '#3e3220',
       blush: 'rgba(225,150,120,0.28)' },
};

/** 颜色按比例暗化（远侧肢体 / 背光面） */
function darken(hex, f = 0.74) {
  const n = parseInt(hex.slice(1), 16);
  return 'rgb(' + Math.round(((n >> 16) & 255) * f) + ',' +
    Math.round(((n >> 8) & 255) * f) + ',' + Math.round((n & 255) * f) + ')';
}

/** 统一描边策略：sticker = 白贴纸双描边 / ink = 墨线 / none = 无描边 */
function sideStroke(ctx, s, P, w = 0.013) {
  if (P.stroke === 'sticker') { stickerStroke(ctx, s, P.C.line); return; }
  if (P.stroke === 'ink') {
    ctx.strokeStyle = P.C.line;
    ctx.lineWidth = Math.max(0.9, s * w);
    ctx.stroke();
  }
}

/** 侧面壳体路径：顶部有机拱弧（背线微起伏）+ 腹缘外凸圆弧闭合。原点 = 壳心
 *  腹缘用三次贝塞尔（两端切向垂直）与拱弧平滑相接，消除下部直角/直棱 */
function sideShellPath(ctx, s, o = {}) {
  const rx = s * (o.rx ?? 0.56);
  const ry = s * (o.ry ?? 0.46);
  const bot = s * (o.bot ?? 0.14);
  const belly = s * (o.belly ?? 0.07);
  const r = sRand(o.seed ?? 91);
  const N = 24;
  const pts = [];
  for (let i = 0; i <= N; i++) {
    const t = Math.PI - (i / N) * Math.PI;          // 左端 → 背顶 → 右端
    const w = (1 + (o.low ?? 0.016) * Math.sin(t * 3 + 1.1) + (o.high ?? 0.005) * (r() - 0.5) * 2)
            * (1 - 0.055 * Math.pow(Math.abs(Math.cos(t)), 3));   // 下角内收 → 底部圆润无方角
    pts.push([Math.cos(t) * rx * w, bot - Math.sin(t) * ry * w]);
  }
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < N; i++) {
    const m = [(pts[i][0] + pts[i + 1][0]) / 2, (pts[i][1] + pts[i + 1][1]) / 2];
    ctx.quadraticCurveTo(pts[i][0], pts[i][1], m[0], m[1]);
  }
  ctx.quadraticCurveTo(pts[N][0], pts[N][1], pts[N][0], pts[N][1]);
  // 腹缘：圆滑外凸弧（控制点在两端正下方 → 与拱弧切向连续，无折角）
  ctx.bezierCurveTo(pts[N][0], bot + belly, pts[0][0], bot + belly, pts[0][0], pts[0][1]);
  ctx.closePath();
}

/** 侧视腿：桨状有机轮廓 + 末端三趾瓣；far = 远侧腿（更暗、更小、露更少） */
function sideLeg(ctx, s, ph, P, o) {
  const C = P.C;
  const far = !!o.far;
  const swing = Math.sin(ph + (o.ph0 || 0) + (far ? 0.85 : 0)) * 0.40;
  const round = P.round ?? 0.5;
  const rx = s * (round > 0.64 ? 0.082 : 0.076) * (far ? 0.88 : 1);
  const ry = s * (round > 0.64 ? 0.162 : 0.175) * (far ? 0.88 : 1);
  ctx.save();
  ctx.translate(o.x + (far ? -s * 0.035 : 0), s * (far ? 0.165 : 0.205));
  // dir=-1 前腿（腿尖向前下）/+1 后腿（腿尖向后下）；swing 越大划幅越大
  ctx.rotate(o.dir * (0.52 + swing * 0.5));
  organicPath(ctx, rx, ry, 41 + (far ? 3 : 0) + (o.dir > 0 ? 0 : 7), {
    low: 0.028, high: 0.010,
    bumps: [[1.12, 0.17, 0.17], [1.57, 0.20, 0.18], [2.02, 0.17, 0.17]],  // 末端三趾瓣（π/2 = 腿尖方向）
  });
  if (P.grad > 0.4 && !far) {
    const g = ctx.createRadialGradient(-rx * 0.3, -ry * 0.45, s * 0.01, 0, 0, ry * 1.25);
    g.addColorStop(0, C.limbHi); g.addColorStop(1, C.limb);
    ctx.fillStyle = g;
  } else {
    ctx.fillStyle = far ? darken(C.limb, 0.78) : C.limb;
  }
  ctx.fill();
  if (!far) sideStroke(ctx, s, P, 0.012);
  // 趾瓣分隔（中高细节档）
  if ((P.detail ?? 0.5) > 0.4 && !far) {
    ctx.strokeStyle = 'rgba(0,0,0,0.26)';
    ctx.lineWidth = Math.max(0.7, s * 0.010);
    ctx.lineCap = 'round';
    [-0.28, 0.28].forEach((a) => {
      ctx.beginPath();
      ctx.moveTo(Math.cos(1.57 + a) * rx * 0.55, Math.sin(1.57 + a) * ry * 0.55);
      ctx.lineTo(Math.cos(1.57 + a) * rx * 1.02, Math.sin(1.57 + a) * ry * 1.02);
      ctx.stroke();
    });
  }
  // 四肢鳞纹（最高细节档 K）
  if ((P.detail ?? 0.5) > 0.85 && !far) {
    ctx.fillStyle = 'rgba(62,50,32,0.22)';
    for (let i = 0; i < 4; i++) {
      const a = 1.57 + (i - 1.5) * 0.30;
      const rr = 0.55 + (i % 2) * 0.14;
      ctx.beginPath();
      ctx.arc(Math.cos(a) * rx * rr, Math.sin(a) * ry * rr, Math.max(0.6, s * 0.007), 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();
}

/**
 * 侧视龟主体（四档共用）
 * P = { C, headScale, round, grad, stroke, detail, kawaii, blush, shadow, smile }
 */
function drawSideTurtle(ctx, s, ph, P) {
  const C = P.C;
  const hs = P.headScale ?? 1.0;
  const round = P.round ?? 0.5;
  const detail = P.detail ?? 0.5;
  const kawaii = P.kawaii ?? 0.5;

  // ① 底部软影（体积档）
  if (P.shadow) {
    ctx.fillStyle = 'rgba(88,68,40,0.13)';
    ctx.beginPath();
    ctx.ellipse(0, s * 0.30, s * 0.62, s * 0.085, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // ② 远侧腿 → ③ 近侧腿（对角步态：近前+远后同步；都在壳前画，壳盖住腿根）
  sideLeg(ctx, s, ph, P, { x: s * 0.25, dir: -1, far: true, ph0: Math.PI });
  sideLeg(ctx, s, ph, P, { x: -s * 0.27, dir: 1, far: true, ph0: 0 });
  sideLeg(ctx, s, ph, P, { x: s * 0.27, dir: -1, ph0: 0 });
  sideLeg(ctx, s, ph, P, { x: -s * 0.29, dir: 1, ph0: Math.PI });

  // ④ 尾（壳后下方，轻摆）
  ctx.save();
  ctx.translate(-s * 0.46, s * 0.075);
  ctx.rotate(Math.sin(ph * 0.9) * 0.10);
  ctx.beginPath();
  ctx.moveTo(0, -s * 0.05);
  ctx.quadraticCurveTo(-s * 0.16, s * 0.005, -s * 0.20, s * 0.10);
  ctx.quadraticCurveTo(-s * 0.10, s * 0.06, 0, s * 0.055);
  ctx.closePath();
  ctx.fillStyle = P.grad > 0.6 ? C.limbHi : C.limb;
  ctx.fill();
  sideStroke(ctx, s, P, 0.011);
  ctx.restore();

  // ⑤ 颈 + 头（先画，壳身随后盖住颈根）
  const bob = Math.sin(ph * 0.62) * s * 0.020;
  const hrx = s * 0.235 * hs;
  const hry = s * 0.205 * hs;
  const hx = s * (0.58 + 0.235 * hs);
  const hy = -s * 0.155 + bob;

  ctx.save();
  ctx.strokeStyle = C.head;
  ctx.lineCap = 'round';
  ctx.lineWidth = s * 0.158 * hs;
  ctx.beginPath();
  ctx.moveTo(s * 0.22, s * 0.01 + bob * 0.3);
  ctx.quadraticCurveTo(s * 0.52, -s * 0.04 + bob * 0.7, hx - hrx * 0.45, hy + hry * 0.05);
  ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.translate(hx, hy);
  organicPath(ctx, hrx, hry, 17, {
    low: 0.024, high: 0.008,
    bumps: [[0, 0.055 + 0.03 * round + (P.snout ?? 0), 0.55]],   // 吻端前凸（甲鱼/枯叶龟更长）
  });
  if (P.grad > 0.4) {
    const g = ctx.createRadialGradient(-hrx * 0.28, -hry * 0.35, s * 0.02, 0, 0, hrx * 1.25);
    g.addColorStop(0, C.headHi); g.addColorStop(1, C.head);
    ctx.fillStyle = g;
  } else {
    ctx.fillStyle = C.head;
  }
  ctx.fill();
  sideStroke(ctx, s, P, 0.014);

  // ── 头颈品种标志（P.mark）────────────────────────────────
  const mark = P.mark ?? 'throat';
  const mkC = lighten(C.yellow, 0.12);
  ctx.lineCap = 'round';
  if (mark === 'throat') {          // 黄喉：眼后黄纵纹 + 下颌喉部黄（侧面最明显的两条特征）
    ctx.strokeStyle = mkC;
    ctx.lineWidth = Math.max(2, s * 0.046 * hs);
    ctx.beginPath();
    ctx.moveTo(hrx * 0.30, -hry * 0.02);
    ctx.quadraticCurveTo(-hrx * 0.30, hry * 0.16, -hrx * 1.35, hry * 0.18);
    ctx.stroke();
    ctx.lineWidth = Math.max(1.6, s * 0.036 * hs);
    ctx.globalAlpha = 0.9;
    ctx.beginPath();
    ctx.moveTo(hrx * 0.70, hry * 0.52);
    ctx.quadraticCurveTo(hrx * 0.30, hry * 0.70, -hrx * 0.10, hry * 0.58);
    ctx.stroke();
    ctx.globalAlpha = 1;
  } else if (mark === 'ear') {      // 耳后斑（巴西红耳 / 焦糖 / 圆澳侧颈）
    ctx.fillStyle = mkC;
    ctx.beginPath();
    ctx.ellipse(-hrx * 0.50, -hry * 0.04, hrx * 0.36, hry * 0.25, -0.20, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 0.45;
    ctx.fillStyle = '#fffdf2';
    ctx.beginPath();
    ctx.ellipse(-hrx * 0.56, -hry * 0.08, hrx * 0.19, hry * 0.12, -0.20, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  } else if (mark === 'line') {     // 头侧细纵线（草龟 / 地图龟 / 钻纹）
    ctx.strokeStyle = mkC;
    ctx.lineWidth = Math.max(1.1, s * 0.021 * hs);
    ctx.globalAlpha = 0.88;
    [[-0.14, 0.04], [0.24, 0.10]].forEach(([y0, y1]) => {
      ctx.beginPath();
      ctx.moveTo(hrx * 0.92, hry * y0);
      ctx.quadraticCurveTo(hrx * 0.05, hry * (y0 - 0.06), -hrx * 1.30, hry * y1);
      ctx.stroke();
    });
    ctx.globalAlpha = 1;
  }

  // 头背碎斑（最高细节档）
  if (detail > 0.85) {
    const r = sRand(53);
    ctx.fillStyle = 'rgba(62,50,32,0.30)';
    for (let i = 0; i < 5; i++) {
      ctx.beginPath();
      ctx.ellipse(-hrx * 0.15 + r() * hrx * 0.7, -hry * 0.45 + r() * hry * 0.55,
        Math.max(0.7, s * 0.010), Math.max(0.6, s * 0.008), r() * 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // 眼：侧面单眼（kawaii 档放大 + 双层高光）
  const ex = hrx * 0.40;
  const ey = -hry * 0.24;
  const er = s * (0.038 + 0.024 * kawaii) * Math.max(0.85, hs * 0.9);
  ctx.beginPath(); ctx.arc(ex, ey, er, 0, Math.PI * 2);
  ctx.fillStyle = '#2a2018'; ctx.fill();
  ctx.beginPath(); ctx.arc(ex + er * 0.30, ey - er * 0.34, er * 0.34, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.95)'; ctx.fill();
  if (kawaii > 0.6) {
    ctx.beginPath(); ctx.arc(ex - er * 0.26, ey + er * 0.30, er * 0.17, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.60)'; ctx.fill();
  }

  // 腮红
  if (P.blush && C.blush) {
    ctx.beginPath();
    ctx.ellipse(hrx * 0.16, hry * 0.32, hrx * 0.26, hry * 0.19, 0, 0, Math.PI * 2);
    ctx.fillStyle = C.blush; ctx.fill();
  }

  // 嘴：微笑弧（smile 档）/ 平嘴
  ctx.strokeStyle = C.line;
  ctx.lineWidth = Math.max(0.9, s * 0.012);
  ctx.lineCap = 'round';
  ctx.beginPath();
  if (P.smile) {
    ctx.moveTo(hrx * 0.86, hry * 0.10);
    ctx.quadraticCurveTo(hrx * 0.66, hry * 0.42, hrx * 0.40, hry * 0.24);
  } else {
    ctx.moveTo(hrx * 0.84, hry * 0.16);
    ctx.quadraticCurveTo(hrx * 0.70, hry * 0.30, hrx * 0.56, hry * 0.16);
  }
  ctx.stroke();
  // 鼻孔
  ctx.beginPath();
  ctx.arc(hrx * 0.93, hry * 0.02, Math.max(0.6, s * 0.007), 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(60,45,25,0.55)'; ctx.fill();
  ctx.restore();

  // ⑥ 壳（最后绘制，覆盖所有部件根部）
  // ⑥ 壳（最后绘制，覆盖所有部件根部）——圆滚滚整椭圆（参考图萌系 = 圆顶面包壳）
  const shellRy = (P.flat ? 0.20 : 0.26) + 0.04 * round;
  const shellCy = (P.flat ? -0.24 : -0.36) + shellRy;   // 壳顶固定；扁平种（甲鱼/枯叶）壳顶更低
  ctx.save();
  ctx.translate(0, s * shellCy);
  const shellPath = () => organicPath(ctx, s * 0.56, s * shellRy, 91, { low: 0.018, high: 0.006 });
  shellPath();
  if (P.rimBand) {                      // 扁平档：两段色壳（浅盘 + 深橄榄裙边）
    ctx.fillStyle = C.shell;
    ctx.fill();
    ctx.save(); shellPath(); ctx.clip();
    ctx.fillStyle = C.rim;
    ctx.fillRect(-s, s * shellRy * 0.55, s * 2, s * 2);
    ctx.restore();
  } else if (P.grad > 0.6) {            // 3D 档：径向渐变
    const g = ctx.createRadialGradient(-s * 0.16, -s * shellRy * 0.42, s * 0.05, 0, 0, s * 0.72);
    g.addColorStop(0, C.shellHi); g.addColorStop(1, C.shell);
    ctx.fillStyle = g; ctx.fill();
  } else {                              // 其余：上亮下暗线性渐变
    const g = ctx.createLinearGradient(0, -s * shellRy, 0, s * shellRy);
    g.addColorStop(0, C.shellHi); g.addColorStop(1, C.shell);
    ctx.fillStyle = g; ctx.fill();
  }
  sideStroke(ctx, s, P, 0.016);

  // 壳面纹路（壳心坐标系，裁剪在壳内）
  ctx.save();
  shellPath();
  ctx.clip();
  const pat = P.pat ?? 'scutes';
  if (pat === 'scutes' || pat === 'rim') {         // 盾缝 + 缘盾刻痕（平滑壳种跳过）
    ctx.strokeStyle = P.rimBand ? C.seam : 'rgba(70,56,32,0.24)';
    ctx.lineWidth = Math.max(0.8, s * 0.010);
    ctx.lineCap = 'round';
    [-0.30, -0.02, 0.26].forEach((fx) => {          // 盾片纵向接缝（柔和弧线，不触底）
      ctx.beginPath();
      ctx.moveTo(s * fx * 0.70, -s * shellRy * 0.88);
      ctx.quadraticCurveTo(s * fx * 1.12, -s * shellRy * 0.18, s * fx * 0.96, s * shellRy * 0.30);
      ctx.stroke();
    });
    for (let i = -3; i <= 3; i++) {                  // 缘盾刻痕（沿下缘内收弧排列，弓形）
      const f = i / 3.6;
      const x = s * 0.50 * f;
      const yb = s * shellRy * (0.78 + 0.15 * Math.cos(Math.PI * f * 0.92));
      ctx.beginPath();
      ctx.moveTo(x * 0.92, yb - s * 0.068);
      ctx.quadraticCurveTo(x * 1.06, yb - s * 0.022, x * 0.98, yb - s * 0.006);
      ctx.stroke();
    }
  }
  if (pat === 'rings') {                           // 同心钻纹（钻纹龟 / 缅甸陆龟）
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.strokeStyle = darken(C.shell, 0.58);
    ctx.lineWidth = Math.max(0.8, s * 0.010);
    ctx.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
      const k = 0.92 - i * 0.21;
      ctx.beginPath();
      ctx.ellipse(0, 0, s * 0.545 * k, s * shellRy * 0.95 * k, 0, Math.PI * 1.04, Math.PI * 1.96);
      ctx.stroke();
    }
    ctx.restore();
  }
  if (pat === 'lines') {                           // 密纵细纹（金线草龟甲面）
    ctx.save();
    ctx.globalAlpha = 0.60;
    ctx.strokeStyle = darken(C.shell, 0.55);
    ctx.lineWidth = Math.max(0.6, s * 0.008);
    ctx.lineCap = 'round';
    for (let i = -3; i <= 3; i++) {
      const fx = i / 3.4;
      ctx.beginPath();
      ctx.moveTo(s * fx * 0.86, -s * shellRy * 0.80);
      ctx.quadraticCurveTo(s * fx * 1.26, -s * shellRy * 0.04, s * fx * 1.00, s * shellRy * 0.68);
      ctx.stroke();
    }
    ctx.restore();
  }
  if (pat === 'rim') {                             // 黄缘闭壳龟：壳缘一圈黄带
    ctx.save();
    ctx.globalAlpha = 0.60;
    ctx.strokeStyle = C.yellow;
    ctx.lineWidth = s * 0.072;
    ctx.beginPath();
    ctx.ellipse(0, 0, s * 0.545, s * (shellRy - 0.010), 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
  // ── 背甲盾片细节（P.scutes：0 = 关闭）────────────────────────
  // ① 盾缝旁极淡亮边 → 盾片微微翘起的体积感
  // ② 缘盾分片：下缘每两刻痕之间一块柔和明暗片（真龟侧面最明显特征）
  // ③ 壳缘内侧柔和暗带 → 甲壳厚度
  // ④ 盾面中央微鼓高光 → 每块盾片独立鼓起
  const sc = P.scutes ?? 0;
  if (sc > 0.05) {
    ctx.strokeStyle = 'rgba(255,250,232,' + (0.20 * sc).toFixed(3) + ')';
    ctx.lineWidth = Math.max(0.7, s * 0.008);
    [-0.30, -0.02, 0.26].forEach((fx) => {
      ctx.beginPath();
      ctx.moveTo(s * fx * 0.70 + s * 0.020, -s * shellRy * 0.30);
      ctx.quadraticCurveTo(s * (fx * 1.12) + s * 0.020, -s * shellRy * 0.18, s * (fx * 0.96) + s * 0.016, s * shellRy * 0.28);
      ctx.stroke();
    });
    for (let i = -3; i < 3; i++) {
      const fm = (i + 0.5) / 3.6;
      const xm = s * 0.50 * fm;
      const ym = s * shellRy * (0.80 + 0.15 * Math.cos(Math.PI * fm * 0.92));
      ctx.beginPath();
      ctx.ellipse(xm, ym - s * 0.030, s * 0.038, s * 0.028, 0, 0, Math.PI * 2);
      ctx.fillStyle = i % 2
        ? 'rgba(255,252,238,' + (0.24 * sc).toFixed(3) + ')'
        : 'rgba(64,50,28,' + (0.13 * sc).toFixed(3) + ')';
      ctx.fill();
    }
    ctx.save();
    ctx.strokeStyle = 'rgba(70,56,32,' + (0.13 * sc).toFixed(3) + ')';
    ctx.lineWidth = s * 0.055;
    ctx.beginPath();
    ctx.ellipse(0, 0, s * 0.545, s * (shellRy - 0.012), 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,250,232,' + (0.10 * sc).toFixed(3) + ')';
    ctx.lineWidth = Math.max(1.2, s * 0.034);
    ctx.lineCap = 'round';
    [-0.16, 0.12].forEach((fx) => {
      ctx.beginPath();
      ctx.moveTo(s * fx * 0.86, -s * shellRy * 0.38);
      ctx.quadraticCurveTo(s * fx * 1.16, -s * shellRy * 0.14, s * fx * 1.00, s * shellRy * 0.26);
      ctx.stroke();
    });
  }
  if (detail > 0.8) {                              // 放射细纹 + 缘盾深斑（绘本档）
    ctx.strokeStyle = 'rgba(62,50,32,0.28)';
    ctx.lineWidth = Math.max(0.6, s * 0.007);
    for (let i = 0; i < 16; i++) {
      const t = Math.PI * (0.10 + 0.80 * (i / 15));
      ctx.beginPath();
      ctx.moveTo(Math.cos(t) * s * 0.30, -Math.sin(t) * s * shellRy * 0.60);
      ctx.lineTo(Math.cos(t) * s * 0.52, -Math.sin(t) * s * shellRy * 0.97);
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(70,56,32,0.26)';
    for (let i = -3; i <= 3; i++) {
      const f = i / 3.6;
      const x = s * 0.50 * f;
      const yb = s * shellRy * (0.78 + 0.15 * Math.cos(Math.PI * f * 0.92));
      ctx.beginPath();
      ctx.ellipse(x * 0.97, yb - s * 0.038, s * 0.028, s * 0.020, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  if (P.grad > 0.6) {                              // 壳面高光弧（3D 感来源）
    ctx.strokeStyle = 'rgba(255,252,238,0.60)';
    ctx.lineWidth = s * 0.042;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.ellipse(0, 0, s * 0.36, s * shellRy * 0.72, 0, Math.PI * 1.06, Math.PI * 1.32);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,252,238,0.32)';
    ctx.lineWidth = s * 0.020;
    ctx.beginPath();
    ctx.ellipse(0, 0, s * 0.36, s * shellRy * 0.72, 0, Math.PI * 1.36, Math.PI * 1.48);
    ctx.stroke();
  }
  ctx.restore();
  ctx.restore();
}

/** 侧视小鱼（与龟同档配色与描边，头朝右 = 与龟同向） */
function drawSideFish(ctx, s, ph, P) {
  const C = P.C;
  const wig = Math.sin(ph * 1.7) * 0.45;
  // 尾鳍（摆动）
  ctx.beginPath();
  ctx.moveTo(-s * 0.46, 0);
  ctx.quadraticCurveTo(-s * 0.74, -s * 0.26 + wig * s * 0.20, -s * 0.90, -s * 0.08 + wig * s * 0.30);
  ctx.quadraticCurveTo(-s * 0.66, wig * s * 0.26, -s * 0.90, s * 0.08 + wig * s * 0.30);
  ctx.quadraticCurveTo(-s * 0.74, s * 0.26 + wig * s * 0.20, -s * 0.46, 0);
  ctx.closePath();
  ctx.fillStyle = darken(C.head, 0.92);
  ctx.fill();
  sideStroke(ctx, s, P, 0.009);
  // 背鳍
  ctx.beginPath();
  ctx.moveTo(-s * 0.10, -s * 0.20);
  ctx.quadraticCurveTo(s * 0.02, -s * 0.46, s * 0.24, -s * 0.16);
  ctx.closePath();
  ctx.fillStyle = darken(C.head, 0.88);
  ctx.fill();
  sideStroke(ctx, s, P, 0.009);
  // 身体
  organicPath(ctx, s * 0.50, s * 0.24, 61, { low: 0.026, high: 0.009, bumps: [[0, 0.05, 0.6]] });
  if (P.grad > 0.4) {
    const g = ctx.createLinearGradient(0, -s * 0.26, 0, s * 0.26);
    g.addColorStop(0, C.headHi); g.addColorStop(1, C.head);
    ctx.fillStyle = g;
  } else {
    ctx.fillStyle = C.head;
  }
  ctx.fill();
  sideStroke(ctx, s, P, 0.010);
  if ((P.detail ?? 0.5) > 0.8) {                   // 侧线
    ctx.strokeStyle = 'rgba(62,50,32,0.26)';
    ctx.lineWidth = Math.max(0.6, s * 0.006);
    ctx.beginPath();
    ctx.moveTo(-s * 0.30, 0);
    ctx.quadraticCurveTo(0, -s * 0.03, s * 0.30, 0);
    ctx.stroke();
  }
  // 胸鳍
  ctx.beginPath();
  ctx.ellipse(s * 0.12, s * 0.14 + wig * s * 0.03, s * 0.13, s * 0.07, 0.4, 0, Math.PI * 2);
  ctx.fillStyle = darken(C.head, 0.94);
  ctx.fill();
  // 眼（白圈 + 瞳 + 高光）
  ctx.beginPath(); ctx.arc(s * 0.30, -s * 0.055, s * 0.075, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.92)'; ctx.fill();
  ctx.beginPath(); ctx.arc(s * 0.31, -s * 0.055, s * 0.045, 0, Math.PI * 2);
  ctx.fillStyle = '#2a2018'; ctx.fill();
  ctx.beginPath(); ctx.arc(s * 0.325, -s * 0.075, s * 0.016, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.95)'; ctx.fill();
  // 嘴
  ctx.beginPath();
  ctx.arc(s * 0.50, s * 0.02, s * 0.03, Math.PI * 0.2, Math.PI * 0.9);
  ctx.strokeStyle = C.line;
  ctx.lineWidth = Math.max(0.8, s * 0.009);
  ctx.stroke();
}

/** hex 向暖白插值（保饱和度的萌系亮色，向纯白插值会灰化） */
function lighten(hex, f = 0.4) {
  const n = parseInt(hex.slice(1), 16);
  const m = (v, w) => Math.round(v + (w - v) * f).toString(16).padStart(2, '0');
  return '#' + m((n >> 16) & 255, 255) + m((n >> 8) & 255, 240) + m(n & 255, 205);
}

/** 由品种基色派生 H 档萌系色板 */
function hSkin(sp) {
  return {
    shell: lighten(sp.shell, 0.30), shellHi: lighten(sp.shell, 0.62), rim: lighten(sp.shell, 0.05),
    limb: lighten(sp.limb, 0.28), limbHi: lighten(sp.limb, 0.55),
    head: lighten(sp.head, 0.24), headHi: lighten(sp.head, 0.55),
    yellow: sp.mark, line: darken(sp.head, 0.48), blush: 'rgba(240,150,120,0.34)',
  };
}

/** 品种 → H 档完整预设（黄喉沿用已确认配色） */
function hPreset(id) {
  const sp = TURTLE_SIDE_SKINS.find((x) => x.id === id) ?? TURTLE_SIDE_SKINS[0];
  return {
    C: id === 'yellowthroat' ? SIDE_PAL.h : hSkin(sp),
    headScale: sp.flat ? 1.26 : 1.42, round: 0.82, grad: 1.0, stroke: 'ink', detail: 0.45,
    scutes: sp.pat === 'smooth' ? 0 : 1.0,
    kawaii: 1.0, blush: true, shadow: true, smile: true,
    mark: sp.mk, pat: sp.pat, flat: !!sp.flat, snout: sp.snout ?? 0,
  };
}

/** 侧面行包装：龟 + 左下同风格小鱼（示意壁纸里同屏朝向一致） */
function sideRow(key) {
  const P = SIDE_PRESETS[key];
  return (ctx, s, ph) => {
    const S = s * 0.70;
    drawSideTurtle(ctx, S, ph, P);
    ctx.save();
    ctx.translate(-S * 1.16, S * 0.40);
    drawSideFish(ctx, S * 0.52, ph + 0.8, P);
    ctx.restore();
  };
}

    { C: cutePalette({ shell: '#c4a862', band: '#dcc384', scute: '#cfb26e', limb: '#a58c50', head: '#d3bd78', yellow: '#f8e37a', line: '#5e4e32' }),
      round: 1, kawaii: 1, blush: true, smile: true }),
    desc: '最"AI"的一档：奶油 caramel 暖色、大圆头大圆眼双高光、圆钝吻端、短圆四肢尾、省略趾缝与颈褶。<b>贴纸/表情包气质</b>。' },
  { key: 'kh', n: 'H', name: '3D 萌渲染（参考图 1-2 类）', draw: drawK3d,

// ── 品种画廊：H 风格 × 13 品种（侧视）──────────────────────
const gallery = document.getElementById('gallery');
const gCtxs = [];
TURTLE_SIDE_SKINS.forEach((sp, i) => {
  const cell = document.createElement('div');
  cell.className = 'gcell';
  cell.innerHTML = `<canvas width="340" height="240"></canvas>
    <div class="gname">${sp.label}</div>
    <div class="gtag">${sp.mk} · ${sp.pat}${sp.flat ? ' · flat' : ''}</div>`;
  gallery.appendChild(cell);
  gCtxs.push({ ctx: cell.querySelector('canvas').getContext('2d'), P: hPreset(sp.id), ph: i * 0.9 });
});

const rows = document.getElementById('rows');
let animCtxs = [];
STYLES.forEach((st) => {
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `
    <div class="num">${st.n}</div>
    <div class="big"><canvas width="480" height="480"></canvas></div>
    <div class="anim"><canvas width="460" height="280"></canvas></div>
    <div class="desc"><h3>${st.n} · ${st.name}</h3><p>${st.desc}</p></div>`;
  rows.appendChild(row);
  const big = row.querySelector('.big canvas').getContext('2d');
  const anim = row.querySelector('.anim canvas').getContext('2d');
  // 静态大图（2x 分辨率，宣纸色衬底）
  big.fillStyle = '#f2ead8'; big.fillRect(0, 0, 480, 480);
  big.save(); big.translate(240, 240); st.draw(big, 140, 0.6); big.restore();
  animCtxs.push({ ctx: anim, draw: st.draw });
});

// 动画小图：setInterval 驱动（无头 virtual-time 亦可见摆动）
let ph = 0;
function renderAnim() {
  ph += 0.09;
  animCtxs.forEach(({ ctx, draw }) => {
    ctx.fillStyle = '#cfe3e6'; ctx.fillRect(0, 0, 460, 280);
    ctx.save(); ctx.translate(150, 140); draw(ctx, 46, ph); ctx.restore();
    ctx.save(); ctx.translate(345, 165); ctx.scale(-0.6, 0.6); draw(ctx, 46, ph*1.2); ctx.restore();
    ctx.restore && ctx.restore();
  });
  gCtxs.forEach((o) => {
    const c = o.ctx;
    c.fillStyle = '#f2ead8'; c.fillRect(0, 0, 340, 240);
    c.save(); c.translate(148, 130); drawSideTurtle(c, 80, ph + o.ph, o.P); c.restore();
  });
}
renderAnim();
setInterval(renderAnim, 33);
</script>
